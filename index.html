<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180v2.png">
<title>简易阅读器 · 写作</title>
<style>
  :root {
    --bg: #eef0f3;
    --panel: #fbfbfc;
    --card: #ffffff;
    --text: #333;
    --text-soft: #98a0ab;
    --accent: #4a6cf7;
    --accent-soft: #eef1fe;
    --border: #e6e9ee;
    --shadow: 0 1px 3px rgba(20,24,34,.06), 0 8px 24px rgba(20,24,34,.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "Source Han Sans SC", "Noto Sans SC", "Noto Sans CJK SC", "思源黑体", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 700;
    color: var(--text);
    background: var(--bg);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  main { flex: 1; min-height: 0; display: flex; }
  .tab-page { flex: 1; min-width: 0; display: flex; flex-direction: column; animation: pageIn .22s ease; }
  .tab-page[hidden] { display: none; }
  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }

  /* 各视图容器：统一纵向 flex 布局，hidden 属性时隐藏 */
  #shelfView, #readerView, #writeListView, #editorView, #profileView {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #shelfView[hidden], #readerView[hidden], #writeListView[hidden], #editorView[hidden], #profileView[hidden] { display: none; }

  /* ===== 底部导航 ===== */
  footer {
    flex: none;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    margin: 0 14px;
    margin-bottom: calc(20px + env(safe-area-inset-bottom));
    border-radius: 24px;
    background: var(--panel);
    background: color-mix(in srgb, var(--panel) 55%, transparent);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    box-shadow: 0 6px 22px rgba(20,24,34,.08);
    padding: 13px 14px;
  }
  footer .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 0;
    cursor: pointer;
    color: var(--text-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 12px;
    transition: color .18s;
  }
  footer .tab-btn svg { width: 23px; height: 23px; stroke-width: 1.8; }
  footer .tab-btn.active { color: var(--accent); font-weight: 700; }
  footer .add-btn {
    flex: none;
    width: 52px;
    height: 52px;
    margin: 0 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text);
    box-shadow: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  footer .add-btn svg { width: 26px; height: 26px; stroke-width: 2.4; }
  footer .add-btn:active { transform: scale(.94); }

  /* ===== 通用标题栏 ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 14px 18px;
    padding-top: calc(22px + env(safe-area-inset-top));
    flex: none;
    flex-wrap: wrap;
  }
  .toolbar .title { font-weight: 700; font-size: 17px; letter-spacing: .3px; line-height: 34px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar .sub, .toolbar .wordcount { font-size: 13px; line-height: 34px; color: var(--text-soft); }
  .toolbar .spacer { flex: 1; }
  .toolbar button, .toolbar select {
    font-size: 13px;
    padding: 7px 13px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 9px;
    cursor: pointer;
    color: var(--text);
  }
  .toolbar button:active { transform: scale(.97); }
  .toolbar .add-mini {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toolbar .add-mini svg { width: 18px; height: 18px; stroke-width: 2; }
  .toolbar .add-mini:active { transform: scale(.94); }

  /* ===== 列表（书架 / 写作） ===== */
  .shelf {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px 24px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    align-content: start;
  }
  .book-card { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .book-card .cover {
    position: relative;
    aspect-ratio: unset;
    width: 100%;
    height: auto;
    min-height: 56px;
    padding: 13px 14px;
    border-radius: 24px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    box-shadow: var(--shadow);
    /* 玻璃态：半透明白色描边 + 背景模糊 */
    border: 1px solid rgba(255,255,255,.28);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    overflow: hidden;
  }
  .book-card .cover .cover-title {
    flex: 1;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.4;
    text-align: left;
    position: relative;
    z-index: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-all;
  }
  .book-card .cover .ops {
    position: static;
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    z-index: 1;
  }
  .book-card .cover .op {
    border: none;
    background: rgba(255,255,255,.92);
    color: #6b7280;
    font-size: 11px;
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .book-card .info {
    padding: 0 14px;
    font-size: 12px;
    color: var(--text-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .empty {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--text-soft);
    font-size: 14px;
    padding: 80px 20px;
    text-align: center;
  }
  .empty svg { width: 72px; height: 72px; stroke: var(--text-soft); stroke-width: 1.4; opacity: .6; }

  /* ===== 阅读器（沉浸式） ===== */
  .reader-body { flex: 1; min-height: 0; position: relative; }
  .reader-scroll {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: calc(30px + env(safe-area-inset-top)) 22px calc(90px + env(safe-area-inset-bottom));
    /* 小说正文：保持原字体与常规字重，不随界面加粗/改字体 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: normal;
  }
  .chapter { max-width: 720px; margin: 0 auto 44px; }
  .chapter h2 {
    font-size: 23px;
    margin: 12px 0 22px;
    padding: 0 0 12px 14px;
    border-bottom: 1px solid var(--border);
    position: relative;
    display: flex;
    align-items: center;
  }
  .chapter h2::before {
    content: '';
    position: absolute;
    left: 0;
    width: 4px;
    height: 1.2em;
    background: var(--accent);
    border-radius: 3px;
  }
  .chapter p {
    margin: 0 0 16px;
    line-height: var(--line-height, 1.9);
    font-size: var(--font-size, 17px);
    text-align: justify;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  /* 阅读器内的顶部 / 底部控制条（点击正文弹出） */
  .reader-bar {
    position: absolute;
    left: 0;
    right: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  .reader-bar.show { opacity: 1; pointer-events: auto; }
  .reader-top {
    top: 0;
    transform: translateY(-100%);
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: rgba(251,251,252,.88);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .reader-top.show { transform: translateY(0); }
  .reader-top .title { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .reader-bottom {
    bottom: 0;
    transform: translateY(100%);
    justify-content: center;
    flex-wrap: wrap;
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(251,251,252,.22);   /* 透明导览条 */
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border-top: 1px solid rgba(20,24,34,.05);
  }
  .reader-bottom.show { transform: translateY(0); }
  .reader-bar button, .reader-bar select {
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 9px;
    cursor: pointer;
    color: var(--text);
  }
  .reader-bar button.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--accent);
  }
  .reader-top button { background: transparent; border-color: transparent; color: var(--accent); font-size: 14px; padding: 6px 8px; }

  /* 顶部控制条：浮动卡片（阅读与写作保持一致，悬浮在内容上方、不贴边） */
  #editorTop, #readerTop {
    top: calc(12px + env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 18px;
    background: rgba(251,251,252,.86);
    box-shadow: 0 10px 30px rgba(20,24,34,.16);
    transform: translateY(-140%);
    flex-wrap: wrap;
    row-gap: 8px;
  }
  #editorTop.show, #readerTop.show { transform: translateY(0); }

  /* 目录抽屉 */
  .drawer-mask {
    position: absolute;
    inset: 0;
    background: rgba(15,18,28,.4);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .drawer-mask.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 300px;
    max-width: 88%;
    background: var(--panel);
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 30px rgba(20,24,34,.12);
    z-index: 21;
    transform: translateX(-100%);
    transition: transform .24s cubic-bezier(.4,0,.2,1);
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .drawer-head {
    display: flex;
    align-items: center;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    font-weight: 700;
    font-size: 15px;
    flex: none;
  }
  .drawer .drawer-head .spacer { flex: 1; }
  .drawer .drawer-head button {
    border: none; background: transparent; cursor: pointer;
    color: var(--text-soft); font-size: 14px; padding: 2px 6px;
  }
  .drawer-toc { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 10px; }
  .drawer-toc button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 9px 11px;
    font-size: 13px;
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .drawer-toc button:active { background: var(--accent-soft); }
  .drawer-toc button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .drawer-settings {
    flex: none;
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .drawer-settings button, .drawer-settings select {
    font-size: 13px;
    padding: 7px 11px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
  }

  /* ===== 写作 ===== */
  .editor-body {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .editor {
    flex: 1;
    min-height: 0;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: calc(34px + env(safe-area-inset-top)) 28px 40px;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    font-weight: normal;
    font-size: 16px;
    line-height: 1.95;
    color: var(--text);
    background: var(--panel);
  }
  .reader-top .wordcount { font-size: 12px; color: var(--text-soft); white-space: nowrap; }
  .editor::placeholder { color: #c2c8d1; }
  .editor-mirror {
    position: absolute;
    top: 0;
    left: 0;
    visibility: hidden;
    pointer-events: none;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .editor-fab {
    position: absolute;
    top: calc(8px + env(safe-area-inset-top));
    right: 12px;
    z-index: 14;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(251,251,252,.7);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--text-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .18s ease;
  }
  .editor-fab svg { width: 20px; height: 20px; stroke-width: 1.9; }

  /* ===== 弹窗 / 提示 ===== */
  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(15,18,28,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-box {
    background: var(--panel);
    border-radius: 16px;
    padding: 22px 20px 16px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal-msg { font-size: 15px; margin-bottom: 16px; line-height: 1.6; }
  .modal-input {
    width: 100%;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 16px;
    outline: none;
    color: var(--text);
    background: var(--card);
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button {
    padding: 8px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
  }
  .modal-actions .m-ok { background: transparent; color: var(--accent); }

  .toast {
    position: fixed;
    left: 0; right: 0;
    bottom: 90px;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 120;
  }
  .toast-inner {
    background: rgba(30,32,40,.92);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .25s, transform .25s;
    max-width: 80%;
  }
  .toast.show .toast-inner { opacity: 1; transform: translateY(0); }

  /* 主题 */
  body[data-theme="gray"]  { --bg:#eef0f3; --panel:#fbfbfc; --card:#ffffff; --text:#333; --text-soft:#98a0ab; --accent-soft:#eef1fe; --border:#e6e9ee; }
  body[data-theme="sepia"] { --bg:#efe3cd; --panel:#faf3e3; --card:#fffaf0; --text:#4a3f2f; --text-soft:#a3957e; --accent:#c98a3d; --accent-soft:#f3e6d4; --border:#e6d7bd; }
  body[data-theme="night"] { --bg:#131419; --panel:#1c1d24; --card:#22232c; --text:#d8d8dd; --text-soft:#6d7480; --accent:#7c96ff; --accent-soft:#232633; --border:#2c2d37; }
  body[data-theme="green"]  { --bg:#e2ece3; --panel:#f2f7f2; --card:#ffffff; --text:#2f3b2f; --text-soft:#8ba08b; --accent:#4d8c57; --accent-soft:#e3efe5; --border:#d3e0d4; }
  body[data-theme="light"]  { --bg:#f5f6f8; --panel:#ffffff; --card:#ffffff; --text:#222; --text-soft:#9aa0aa; --accent:#4a6cf7; --accent-soft:#eef1fe; --border:#e8eaee; }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body data-theme="gray">

<main>
  <!-- ============ 阅读 Tab ============ -->
  <section id="readerTab" class="tab-page">
    <!-- 书架视图 -->
    <div id="shelfView">
      <div class="home-head">
        <div class="home-copy">
          <h1>Hello Reader</h1>
          <p class="home-subtitle">I have some news for you</p>
        </div>
        <button class="home-add-btn" type="button" onclick="openReaderFile()" aria-label="Add book" title="Add book">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
      <label class="shelf-search" aria-label="搜索书名">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.4 4.4"/>
        </svg>
        <input id="shelfSearch" type="search" placeholder="Search books" autocomplete="off" enterkeyhint="search" spellcheck="false" oninput="renderShelf()">
      </label>
      <div class="shelf-carousel">
        <div class="shelf" id="shelf" tabindex="0" aria-label="书架，左右滑动切换书籍"></div>
        <div class="shelf-pagination" id="shelfPagination" hidden>
          <div class="shelf-dots" id="shelfDots" aria-label="书籍切换">
            <button type="button" aria-label="上一本书"></button>
            <button type="button" class="active" aria-label="当前书籍" aria-current="page" disabled></button>
            <button type="button" aria-label="下一本书"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- 阅读器视图（沉浸式） -->
    <div id="readerView" hidden>
      <div class="reader-body">
        <div class="reader-scroll" id="readerScroll"></div>

        <!-- 顶部控制条（点击正文弹出） -->
        <div class="reader-bar reader-top" id="readerTop">
          <button onclick="exitReader()">返回</button>
          <span class="title" id="bookTitle">未打开书籍</span>
          <button onclick="openDrawer()">目录</button>
        </div>

        <!-- 底部透明导览条（点击正文弹出） -->
        <div class="reader-bar reader-bottom" id="readerBottom">
          <button onclick="changeChapter(-1)">上一章</button>
          <button onclick="changeFont(-1)">A-</button>
          <button onclick="changeFont(1)">A+</button>
          <button onclick="changeChapter(1)">下一章</button>
        </div>

        <!-- 目录抽屉 -->
        <div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
        <aside class="drawer" id="drawer">
          <div class="drawer-head">
            <span>目录</span>
            <span class="spacer"></span>
            <button onclick="closeDrawer()">收起</button>
          </div>
          <div class="drawer-toc" id="drawerToc"></div>
        </aside>
      </div>
    </div>
  </section>

  <!-- ============ 写作 Tab ============ -->
  <section id="writerTab" class="tab-page" hidden>
    <!-- 写作作品列表 -->
    <div id="writeListView">
      <div class="home-head">
        <div class="home-copy">
          <h1>Hello Writer</h1>
          <p class="home-subtitle">Turn your ideas into stories</p>
        </div>
        <button class="home-add-btn" type="button" onclick="writerNew(true)" aria-label="New writing" title="New writing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 20l4.4-1 10.1-10.1a2.1 2.1 0 0 0-3-3L5.4 16z"/>
            <path d="m14.5 6.9 3 3"/>
          </svg>
        </button>
      </div>
      <div class="writer-carousel">
        <div class="shelf" id="writeList" tabindex="0" aria-label="写作页，左右滑动切换页面"></div>
        <div class="shelf-pagination" id="writePagination" hidden>
          <div class="shelf-dots" id="writeDots" aria-label="写作页切换">
            <button type="button" aria-label="上一页" onclick="moveWriting(-1)"></button>

<script>
"use strict";

// ============ 通用工具 ============
const $ = (id) => document.getElementById(id);
const genId = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
const EPUB_CHAPTER_PREFIX = "\uE000EPUB:";

const TITLE_RE = /^[\s\u3000]*(?:(?:第[零一二三四五六七八九十百千万两〇0-9０-９]+[章節节卷回篇部集])|序章|序言|序曲|前言|引子|引言|楔子|尾声|尾聲|终章|終章|后记|後記|后序|结语|結語|番外|(?:Chapter|CHAPTER|Part|PART)\s*\d+|卷[零一二三四五六七八九十百千万两〇0-9０-９]+).*$/;

function decodeBest(buffer) {
  const u8 = new Uint8Array(buffer);
  if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) {
    return new TextDecoder("utf-8").decode(buffer.subarray(3));
  }
  if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xFE) {
    return new TextDecoder("utf-16le").decode(buffer.subarray(2));
  }
  if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) {
    return new TextDecoder("utf-16be").decode(buffer.subarray(2));
  }
  const candidates = ["utf-8", "gb18030", "big5"];
  for (const enc of candidates) {
    try { return new TextDecoder(enc, { fatal: true }).decode(buffer); }
    catch (e) { /* 尝试下一个编码 */ }
  }
  return new TextDecoder("utf-8").decode(buffer);
}

function parseChapters(text) {
  const lines = text.split(/\r?\n/);
  const chapters = [];
  let cur = null;
  for (const line of lines) {
    if (line.startsWith(EPUB_CHAPTER_PREFIX)) {
      if (cur) chapters.push(cur);
      cur = { title: line.slice(EPUB_CHAPTER_PREFIX.length).trim() || "正文", paras: [] };
    } else if (TITLE_RE.test(line)) {
      if (cur) chapters.push(cur);
      cur = { title: line.trim() || "正文", paras: [] };
    } else {
      if (!cur) cur = { title: "正文", paras: [] };
      const t = line.trim();
      if (t) cur.paras.push(t);
    }
  }
  if (cur) chapters.push(cur);
  return chapters;
}

// 章节切分对整本书做正则扫描，书架渲染时每本书都会调用两次；
// 按 id + 内容长度缓存，避免每次重建书架都重新解析全书。
const chapterCache = new Map();
function warmChapterCache(book) {
  const content = (book && book.content) || "";
  const cached = chapterCache.get(book.id);
  return cached && cached.length === content.length ? cached : null;
}
function parseChaptersCached(book) {
  const cached = warmChapterCache(book);
  if (cached) return cached.chapters;
  const content = (book && book.content) || "";
  const chapters = parseChapters(content);
  chapterCache.set(book.id, { length: content.length, chapters });
  return chapters;
}

function readFileAsArrayBuffer(file) {
  if (file && typeof file.arrayBuffer === "function") return file.arrayBuffer();
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsArrayBuffer(file);
  });
}

function resolveEpubPath(basePath, href) {
  const cleanHref = String(href || "").split("#")[0].split("?")[0];
  let decodedHref = cleanHref;
  try { decodedHref = decodeURIComponent(cleanHref); } catch (e) { /* 保留原路径 */ }
  const parts = String(basePath || "").split("/").slice(0, -1).concat(decodedHref.split("/"));
  const normalized = [];
  parts.forEach(part => {
    if (!part || part === ".") return;
    if (part === "..") normalized.pop();
    else normalized.push(part);
  });
  return normalized.join("/");
}

function epubXmlElements(root, localName) {
  return Array.from(root.getElementsByTagNameNS("*", localName));
}

function epubMimeFromPath(path) {
  const ext = String(path || "").split(".").pop().toLowerCase();
  return ({ jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp", gif: "image/gif", svg: "image/svg+xml" })[ext] || "image/jpeg";
}

async function extractEpubBook(buffer, fallbackTitle) {
  if (typeof JSZip === "undefined") throw new Error("EPUB parser unavailable");
  const zip = await JSZip.loadAsync(buffer);
  const containerEntry = zip.file("META-INF/container.xml");
  if (!containerEntry) throw new Error("EPUB container is missing");

  const xmlParser = new DOMParser();
  const containerDoc = xmlParser.parseFromString(await containerEntry.async("text"), "application/xml");
  const rootFile = epubXmlElements(containerDoc, "rootfile")[0];
  const opfPath = rootFile && rootFile.getAttribute("full-path");
  const opfEntry = opfPath && zip.file(opfPath);
  if (!opfEntry) throw new Error("EPUB package is missing");

  const opfDoc = xmlParser.parseFromString(await opfEntry.async("text"), "application/xml");
  const packageTitle = (epubXmlElements(opfDoc, "title")[0]?.textContent || fallbackTitle || "未命名").trim();
  const manifest = new Map();
  epubXmlElements(opfDoc, "item").forEach(item => {
    const id = item.getAttribute("id");
    if (!id) return;
    manifest.set(id, {
      id,
      href: item.getAttribute("href") || "",
      mediaType: item.getAttribute("media-type") || "",
      properties: item.getAttribute("properties") || "",
    });
  });

  let coverItem = Array.from(manifest.values()).find(item => item.properties.split(/\s+/).includes("cover-image"));
  if (!coverItem) {
    const coverMeta = epubXmlElements(opfDoc, "meta").find(meta => (meta.getAttribute("name") || "").toLowerCase() === "cover");
    if (coverMeta) coverItem = manifest.get(coverMeta.getAttribute("content"));
  }
  if (!coverItem) {
    const guideCover = epubXmlElements(opfDoc, "reference").find(ref => /cover/i.test(ref.getAttribute("type") || ""));
    if (guideCover) coverItem = { href: guideCover.getAttribute("href") || "", mediaType: "", properties: "" };
  }
  if (!coverItem) {
    coverItem = Array.from(manifest.values()).find(item => item.mediaType.startsWith("image/") && /cover|封面/i.test(item.id + " " + item.href));
  }

  let coverDataUrl = "";
  if (coverItem && coverItem.href) {
    let coverPath = resolveEpubPath(opfPath, coverItem.href);
    let coverEntry = zip.file(coverPath);
    let coverMime = coverItem.mediaType || epubMimeFromPath(coverPath);
    if (coverEntry && /html|xhtml/i.test(coverMime + " " + coverPath)) {
      const coverDoc = new DOMParser().parseFromString(await coverEntry.async("text"), "text/html");
      const imageRef = coverDoc.querySelector("img")?.getAttribute("src") || coverDoc.querySelector("image")?.getAttribute("href") || "";
      if (imageRef) {
        coverPath = resolveEpubPath(coverPath, imageRef);
        coverEntry = zip.file(coverPath);
        coverMime = epubMimeFromPath(coverPath);
      }
    }
    if (coverEntry && coverMime.startsWith("image/")) {
      coverDataUrl = "data:" + coverMime + ";base64," + await coverEntry.async("base64");
    }
  }

  let readingItems = epubXmlElements(opfDoc, "itemref")
    .map(itemref => manifest.get(itemref.getAttribute("idref")))
    .filter(Boolean);
  if (!readingItems.length) {
    readingItems = Array.from(manifest.values()).filter(item => /html|xhtml/i.test(item.mediaType + " " + item.href) && !item.properties.split(/\s+/).includes("nav"));
  }

  const sections = [];
  for (const item of readingItems) {
    const path = resolveEpubPath(opfPath, item.href);
    const entry = zip.file(path);
    if (!entry) continue;
    const doc = new DOMParser().parseFromString(await entry.async("text"), "text/html");
    doc.querySelectorAll("script, style, noscript, nav").forEach(node => node.remove());
    const headingNode = doc.querySelector("h1, h2, h3") || doc.querySelector("title");
    const heading = (headingNode?.textContent || "").replace(/\s+/g, " ").trim();
    const paras = Array.from(doc.querySelectorAll("p, li, blockquote"))
      .map(node => (node.textContent || "").replace(/\s+/g, " ").trim())
      .filter(Boolean);
    if (!paras.length) {
      paras.push(...(doc.body?.textContent || "").split(/\n+/).map(line => line.replace(/\s+/g, " ").trim()).filter(Boolean));
    }
    if (!paras.length) continue;
    sections.push({ title: heading || "正文 " + (sections.length + 1), paras });
  }

  if (!sections.length) throw new Error("EPUB has no readable text");
  const content = sections.map(section => EPUB_CHAPTER_PREFIX + section.title + "\n" + section.paras.join("\n")).join("\n\n");
  return { title: packageTitle, content, coverDataUrl };
}

function formatCount(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + " 万字";
  return n + " 字";
}
function formatTime(ts) {
  return new Date(ts).toLocaleString("zh-CN", {
    month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
  });
}
function currentChapterTitle(book, chapters) {
  // 冷缓存时不解析整本书，先给占位文案，空闲时解析完再就地更新
  const list = chapters || (warmChapterCache(book) ? warmChapterCache(book).chapters : null);
  if (!list) return "开始阅读";
  if (!list.length) return "正文";
  let current = 0;
  try {
    const saved = JSON.parse(localStorage.getItem("reader:progress:" + book.id) || "null");
    if (saved && saved.current !== undefined && Number.isFinite(Number(saved.current))) {
      current = Math.trunc(Number(saved.current));
    }
  } catch (error) {
    current = 0;
  }
  current = Math.max(0, Math.min(list.length - 1, current));
  return list[current].title || "正文";
}
function storedReadingTime(bookId) {
  const value = Number(localStorage.getItem("reader:reading-time:" + bookId));
  return Number.isFinite(value) && value > 0 ? value : 0;
}
function liveReadingTime(bookId) {
  let total = storedReadingTime(bookId);
  if (readingSession.bookId === bookId && readingSession.startedAt) {
    total += readingSessionElapsed();
  }
  return total;
}
function formatReadingTime(milliseconds) {
  if (milliseconds <= 0) return "0 min";
  if (milliseconds < 60000) return "<1 min";
  const totalMinutes = Math.floor(milliseconds / 60000);
  if (totalMinutes < 60) return totalMinutes + " min";
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  return hours + "h" + (minutes ? " " + minutes + "min" : "");
}
function readingDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return year + "-" + month + "-" + day;
}
function readingHistory() {
  try {
    const value = JSON.parse(localStorage.getItem("reader:reading-days") || "{}");
    return value && typeof value === "object" ? value : {};
  } catch (error) {
    return {};
  }
}
function recordReadingInterval(start, end) {
  if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return;
  const history = readingHistory();
  let cursor = start;
  while (cursor < end) {
    const currentDate = new Date(cursor);
    const midnight = new Date(currentDate);
    midnight.setHours(24, 0, 0, 0);
    const segmentEnd = Math.min(end, midnight.getTime());
    const key = readingDateKey(currentDate);
    history[key] = (Number(history[key]) || 0) + (segmentEnd - cursor);
    cursor = segmentEnd;
  }
  localStorage.setItem("reader:reading-days", JSON.stringify(history));
  const total = Number(localStorage.getItem("reader:reading-total-ms")) || 0;
  localStorage.setItem("reader:reading-total-ms", String(total + (end - start)));
}
function recentReadingDays(count) {
  const history = readingHistory();
  const days = [];
  const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
  for (let offset = count - 1; offset >= 0; offset--) {
    const date = new Date();
    date.setHours(12, 0, 0, 0);
    date.setDate(date.getDate() - offset);
    const milliseconds = Number(history[readingDateKey(date)]) || 0;
    days.push({ key: readingDateKey(date), label: weekdays[date.getDay()], milliseconds });
  }
  return days;
}
function readingStreak() {
  const history = readingHistory();
  const date = new Date();
  date.setHours(12, 0, 0, 0);
  if (!(Number(history[readingDateKey(date)]) > 0)) date.setDate(date.getDate() - 1);
  let streak = 0;
  while (Number(history[readingDateKey(date)]) > 0) {
    streak += 1;
    date.setDate(date.getDate() - 1);
  }
  return streak;
}
function bookProgress(book, chapters) {
  try {
    const saved = JSON.parse(localStorage.getItem("reader:progress:" + book.id) || "null");
    if (!saved) return 0;
    if (Number.isFinite(saved.percent)) return Math.max(0, Math.min(100, Math.round(saved.percent)));
    const list = chapters || (warmChapterCache(book) ? warmChapterCache(book).chapters : null);
    if (!list) return 0;
    const total = Math.max(1, list.length);
    const current = Math.max(0, Math.min(total - 1, Number(saved.current) || 0));
    return Math.round((current / total) * 100);
  } catch (error) {
    return 0;
  }
}

function fitSingleLineTitle(element, minSize) {
  if (!element || !element.clientWidth) return;
  element.style.fontSize = "";
  const maxSize = parseFloat(getComputedStyle(element).fontSize) || minSize;
  if (element.scrollWidth <= element.clientWidth) return;
  const proportionalSize = maxSize * (element.clientWidth / element.scrollWidth);
  element.style.fontSize = Math.max(minSize, Math.min(maxSize, proportionalSize)) + "px";
}

let bookCoverBag = [];
function nextBookCoverIndex() {
  if (!BOOK_COVER_ILLUSTRATIONS.length) return 0;
  if (!bookCoverBag.length) {
    bookCoverBag = BOOK_COVER_ILLUSTRATIONS.map((_, index) => index);
    for (let index = bookCoverBag.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(Math.random() * (index + 1));
      [bookCoverBag[index], bookCoverBag[swapIndex]] = [bookCoverBag[swapIndex], bookCoverBag[index]];
    }
  }
  return bookCoverBag.pop();
}

function bookCoverIndex(book) {
  const index = Number(book.coverIndex);
  if (Number.isInteger(index) && index >= 0 && index < BOOK_COVER_ILLUSTRATIONS.length) return index;
  let hash = 0;
  const seed = String(book.id || book.title || "book");
  for (let i = 0; i < seed.length; i += 1) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
  return BOOK_COVER_ILLUSTRATIONS.length ? hash % BOOK_COVER_ILLUSTRATIONS.length : 0;
}

function attachBookSwipeToDelete(art, surface, reveal, page, bookId, deleteAction = null) {
  let tracking = false;
  let startX = 0;
  let startY = 0;
  let pointerId = null;
  let latestX = 0;
  let latestY = 0;
  let swipeFrame = 0;
  let deleting = false;
  const isWritingDelete = art.classList.contains("write-page-card");
  const revealDistance = 72;
  const deleteDistance = isWritingDelete ? 132 : 154;
  const maxDistance = isWritingDelete ? 148 : 172;
  const revealTransform = (y, scale) => "translate3d(0," + y + "px,0) scale(" + (isWritingDelete ? 1 : scale) + ")";
  const closeReveal = () => {
    if (swipeFrame) cancelAnimationFrame(swipeFrame);
    swipeFrame = 0;
    art.classList.remove("is-swiping", "delete-armed", "delete-committing");
    surface.style.removeProperty("transform");
    surface.style.removeProperty("opacity");
    reveal.style.removeProperty("opacity");
    reveal.style.removeProperty("transform");
    reveal.disabled = true;
    reveal.setAttribute("aria-hidden", "true");
  };
  const reset = () => {
    tracking = false;
    pointerId = null;
    closeReveal();
  };
  const paintSwipe = () => {
    swipeFrame = 0;
    if (!tracking || deleting) return;
    const dx = latestX - startX;
    const dy = latestY - startY;
    if (dy >= -8 || Math.abs(dy) <= Math.abs(dx) * 1.15) return;
    page._suppressOpen = true;
    art.classList.add("is-swiping");
    const distance = Math.min(maxDistance, Math.max(0, -dy));
    const offset = -Math.min(maxDistance, distance * (isWritingDelete ? .93 : .86));
    const revealProgress = Math.min(1, Math.max(0, (distance - 10) / (revealDistance - 10)));
    const deleteProgress = Math.min(1, Math.max(0, (distance - revealDistance) / (deleteDistance - revealDistance)));
    surface.style.transform = "translate3d(0," + offset + "px,0)";
    reveal.style.opacity = String(revealProgress);
    reveal.style.transform = revealTransform(8 * (1 - revealProgress), 1 + deleteProgress * .035);
    const armed = distance >= deleteDistance;
    art.classList.toggle("delete-armed", armed);
  };
  art.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    if (deleting) return;
    // 只记录起点，不进入 tracking：避免抢走横向滑动手势
    pointerId = event.pointerId;
    startX = event.clientX;
    startY = event.clientY;
    latestX = startX;
    latestY = startY;
  });
  art.addEventListener("pointermove", event => {
    if (event.pointerId !== pointerId) return;
    latestX = event.clientX;
    latestY = event.clientY;
    const dx = latestX - startX;
    const dy = latestY - startY;
    const vertical = dy < -8 && Math.abs(dy) > Math.abs(dx) * 1.15;
    // 只有确认是「竖向往上滑」才接管手势，横向滑动完全交还给浏览器
    if (!tracking) {
      if (!vertical) return;
      tracking = true;
      try { art.setPointerCapture?.(pointerId); } catch (_) {}
    }
    if (!swipeFrame) swipeFrame = requestAnimationFrame(paintSwipe);
  });
  art.addEventListener("pointerup", async event => {
    if (!tracking || event.pointerId !== pointerId) return;
    if (swipeFrame) {
      cancelAnimationFrame(swipeFrame);
      swipeFrame = 0;
    }
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    try {
      if (art.hasPointerCapture?.(event.pointerId)) art.releasePointerCapture(event.pointerId);
    } catch (_) {}
    tracking = false;
    pointerId = null;
    const verticalSwipe = dy < -8 && Math.abs(dy) > Math.abs(dx) * 1.15;
    const shouldDelete = verticalSwipe && -dy >= deleteDistance;
    if (verticalSwipe) {
      event.preventDefault();
      event.stopPropagation();
      page._suppressOpen = true;
    }
    if (!shouldDelete) {
      closeReveal();
      setTimeout(() => { page._suppressOpen = false; }, 260);
      return;
    }
    deleting = true;
    if (isWritingDelete) {
      art.classList.remove("is-swiping");
      art.classList.add("delete-armed");
      surface.style.transform = "translate3d(0,-64px,0)";
      reveal.style.opacity = "1";
      reveal.style.transform = revealTransform(0, 1);
      await new Promise(resolve => setTimeout(resolve, 180));
    }
    art.classList.remove("is-swiping", "delete-armed");
    art.classList.add("delete-committing");
    surface.style.transform = "translate3d(0,-138px,0)";
    surface.style.opacity = "0";
    reveal.style.opacity = "1";
    reveal.style.transform = revealTransform(isWritingDelete ? 0 : -8, 1.04);
    await new Promise(resolve => setTimeout(resolve, 150));
    if (deleteAction) await deleteAction(bookId, event);
    else await removeBook(bookId, event, true);
  });
  art.addEventListener("pointercancel", event => {
    try {
      if (art.hasPointerCapture?.(event.pointerId)) art.releasePointerCapture(event.pointerId);
    } catch (_) {}
    reset();
    page._suppressOpen = false;
  });
}

// 卡片书脊使用克制的书封色。
const COVER_COLORS = [
  "#446c84", "#657c70", "#967156", "#6c718e",
  "#9b786f", "#6d8792", "#777b62", "#9a825e",
];
function pickCoverColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return COVER_COLORS[h % COVER_COLORS.length];
}
// ============ 弹窗 / 提示（替代 iOS 上可能失效的原生 confirm/alert/prompt） ============
function showConfirm(msg, okText) {
  return new Promise((resolve) => {
    const mask = document.createElement("div");
    mask.className = "modal-mask";
    mask.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true"><div class="modal-msg"></div><div class="modal-actions"></div></div>';
    mask.querySelector(".modal-msg").textContent = msg;
    const cancel = document.createElement("button");
    cancel.textContent = "取消";
    const ok = document.createElement("button");
    ok.textContent = okText || "确定";
    ok.className = "m-ok";
    if (/删除|清空/.test(ok.textContent)) ok.classList.add("m-danger");
    mask.querySelector(".modal-actions").appendChild(cancel);
    mask.querySelector(".modal-actions").appendChild(ok);
    document.body.appendChild(mask);
    const done = (v) => closeModal(mask, () => resolve(v));
    cancel.onclick = () => done(false);
    ok.onclick = () => done(true);
    mask.addEventListener("click", (e) => { if (e.target === mask) done(false); });
    mask.addEventListener("keydown", event => { if (event.key === "Escape") done(false); });
    setTimeout(() => cancel.focus(), 50);
  });
}

function showPrompt(title, initial) {
  return new Promise((resolve) => {
    const mask = document.createElement("div");
    mask.className = "modal-mask";
    mask.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true"><div class="modal-msg"></div><input class="modal-input" type="text"><div class="modal-actions"></div></div>';
    mask.querySelector(".modal-msg").textContent = title;
    const inp = mask.querySelector(".modal-input");
    inp.value = initial || "";
    const cancel = document.createElement("button");
    cancel.textContent = "取消";
    const ok = document.createElement("button");
    ok.textContent = "确定";
    ok.className = "m-ok";
    mask.querySelector(".modal-actions").appendChild(cancel);
    mask.querySelector(".modal-actions").appendChild(ok);
    document.body.appendChild(mask);
    const done = (v) => closeModal(mask, () => resolve(v));
    cancel.onclick = () => done(null);
    ok.onclick = () => done(inp.value);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") done(inp.value); });
    mask.addEventListener("keydown", event => { if (event.key === "Escape") done(null); });
    mask.addEventListener("click", (e) => { if (e.target === mask) done(null); });
    setTimeout(() => inp.focus(), 50);
  });
}

function showBookInfoDialog(initialTitle) {
  return new Promise((resolve) => {
    const mask = document.createElement("div");
    mask.className = "modal-mask";
    mask.innerHTML = '<div class="modal-box book-info-modal" role="dialog" aria-modal="true">'
      + '<div class="modal-msg">完善书籍信息</div>'
      + '<div class="book-info-form">'
      + '<label><span>书名</span><input class="modal-input" data-book-field="title" type="text" maxlength="80"></label>'
      + '</div><div class="modal-actions"></div></div>';
    const titleInput = mask.querySelector('[data-book-field="title"]');
    titleInput.value = initialTitle || "";

    cancel.textContent = "取消";
    const ok = document.createElement("button");
    ok.textContent = "导入";
    ok.className = "m-ok";
    mask.querySelector(".modal-actions").append(cancel, ok);
    document.body.appendChild(mask);

    const close = (value) => closeModal(mask, () => resolve(value));
    const submit = () => {
      const title = titleInput.value.trim();
      if (!title) {
        titleInput.classList.add("invalid");
        titleInput.focus();
        showToast("书名不能为空");
        return;
      }

    };
    cancel.onclick = () => close(null);
    ok.onclick = submit;
    titleInput.addEventListener("input", () => titleInput.classList.remove("invalid"));
    titleInput.addEventListener("keydown", event => {
      if (event.key === "Enter") { event.preventDefault(); submit(); }
    });
    mask.addEventListener("keydown", event => { if (event.key === "Escape") close(null); });
    mask.addEventListener("click", event => { if (event.target === mask) close(null); });
    setTimeout(() => { titleInput.focus(); titleInput.select(); }, 50);
  });
}

function closeModal(mask, onClosed) {
  if (!mask || mask.classList.contains("is-closing")) return;
  mask.classList.add("is-closing");
  mask.querySelectorAll("button, input").forEach(control => { control.disabled = true; });
  const finish = () => {
    mask.remove();
    onClosed?.();
  };
  mask.addEventListener("animationend", event => {
    if (event.target === mask) finish();
  }, { once: true });
  setTimeout(() => {
    if (mask.isConnected) finish();
  }, 220);
}

function animateAddControl(button) {
  if (!button) return;
  button.classList.remove("is-adding");
  void button.offsetWidth;
  button.classList.add("is-adding");
  setTimeout(() => button.classList.remove("is-adding"), 420);
}

function showToast(msg) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.className = "toast";
    const inner = document.createElement("div");
    inner.className = "toast-inner";
    t.appendChild(inner);
    document.body.appendChild(t);
  }
  const inner = t.querySelector(".toast-inner") || t;
  inner.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ============ IndexedDB ============
const DB_NAME = "novel-reader";
const STORE = "books";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function putBook(book) {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(book);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getAllBooks() {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function deleteBook(id) {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getBookById(id) {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

// ============ 底部 Tab 切换 ============
let currentBottomTab = "reader";
let primaryTabMotionTimer = null;

function updatePrimaryTabMotion(tab) {
  const pill = $("mainTabPill");
  if (!pill) return;

  if (tab === "profile") {
    pill.classList.add("profile-selected");
    currentBottomTab = tab;
    return;
  }
  if (tab !== "reader" && tab !== "writer") return;

  pill.classList.remove("profile-selected");
  pill.classList.remove("squeeze-to-reader", "squeeze-to-writer");

  if (currentBottomTab === "profile" || pill.dataset.active === tab) {
    pill.dataset.active = tab;
    currentBottomTab = tab;
    return;
  }

  void pill.offsetWidth;
  pill.dataset.active = tab;
  pill.classList.add(tab === "writer" ? "squeeze-to-writer" : "squeeze-to-reader");
  clearTimeout(primaryTabMotionTimer);
  primaryTabMotionTimer = setTimeout(() => {
    pill.classList.remove("squeeze-to-reader", "squeeze-to-writer");
  }, 500);
  currentBottomTab = tab;
}

function switchTab(tab) {
  if (tab !== "reader") stopReadingSession();
  updatePrimaryTabMotion(tab);
  $("readerTab").hidden = (tab !== "reader");
  $("writerTab").hidden = (tab !== "writer");
  $("profileTab").hidden = (tab !== "profile");
  $("tabReader").classList.toggle("active", tab === "reader");
  $("tabWriter").classList.toggle("active", tab === "writer");
  $("tabProfile").classList.toggle("active", tab === "profile");
  $("footer").style.display = "";
  if (tab !== "profile") closeProfileBooks(false);
  if (tab === "writer") renderWriteList();
  if (tab === "profile") {
    closeProfileBooks(false);
    renderProfile();
  }
  if (tab === "reader" && !$("shelfView").hidden) requestAnimationFrame(restoreShelfPosition);
}

// ============ 阅读 Tab 内部视图（含沉浸式 footer 控制） ============
function showInReaderTab(view) {
  $("shelfView").hidden = (view !== "shelf");
  $("readerView").hidden = (view !== "reader");
  // 进入阅读器时隐藏底部导览条，退出时恢复
  $("footer").style.display = view === "reader" ? "none" : "";
  if (view === "reader" && currentBook) startReadingSession(currentBook.id);
  else stopReadingSession();
  if (view === "shelf") {
    closeDrawer();
    setControls(false);
    requestAnimationFrame(restoreShelfPosition);
  }
}

// ============ 列表 ============
let shelfRenderRequest = 0;
let shelfSearchActive = false;
let shelfBeforeSearchBookId = null;

function normalizeShelfSearch(value) {
  return String(value || "").normalize("NFKC").trim().toLocaleLowerCase();
}

async function renderShelf(preloadedBooks = null) {
  const request = ++shelfRenderRequest;
  const query = normalizeShelfSearch($("shelfSearch").value);
  const storedBooks = (preloadedBooks || await getAllBooks()).filter(b => b.kind === "book");
  for (const book of storedBooks) {
    if (!Number.isInteger(Number(book.coverIndex))) {
      book.coverIndex = nextBookCoverIndex();
      await putBook(book);
    }
  }
  if (request !== shelfRenderRequest) return;
  const books = storedBooks.filter(book => {
    if (!query) return true;
    const searchableText = [book.title, currentChapterTitle(book, parseChaptersCached(book))].map(normalizeShelfSearch).join(" ");
    return searchableText.includes(query);
  });
  books.sort((a, b) => b.updatedAt - a.updatedAt);
  if (query && !shelfSearchActive) {
    shelfSearchActive = true;
    shelfBeforeSearchBookId = activeShelfBookId;
  } else if (!query && shelfSearchActive) {
    shelfSearchActive = false;
    activeShelfBookId = shelfBeforeSearchBookId;
    shelfBeforeSearchBookId = null;
  }
  if (query && !books.some(book => book.id === activeShelfBookId)) {
    activeShelfBookId = books[0]?.id || null;
  }
  renderBookPages(books, query);
}

let activeWritePageId = null;
let pendingAddedWriteId = null;
let writePageCount = 0;
let writeScrollTimer = null;
let writeTouching = false;
let lastWriteDotIndex = null;
let writeDotAnimationTimer = null;

function currentWriteIndex() {
  const host = $("writeList");
  return host.clientWidth ? Math.round(host.scrollLeft / host.clientWidth) : 0;
}

function animateWriteDots(direction) {
  const dots = $("writeDots");
  clearTimeout(writeDotAnimationTimer);
  dots.classList.remove("moving-next", "moving-prev");
  void dots.offsetWidth;
  dots.classList.add(direction === "next" ? "moving-next" : "moving-prev");
  writeDotAnimationTimer = setTimeout(() => dots.classList.remove("moving-next", "moving-prev"), 540);
}

function updateWritePagination() {
  const host = $("writeList");
  if (!writePageCount || !host.clientWidth) return;
  const position = currentWriteIndex();
  const index = writePageCount === 1 ? 0 : (position - 1 + writePageCount) % writePageCount;
  const pages = host.querySelectorAll(".write-page-card:not([data-clone])");
  if (!pages[index]) return;
  activeWritePageId = pages[index].dataset.writeId;
  if (lastWriteDotIndex !== null && index !== lastWriteDotIndex && writePageCount > 1) {
    const forward = (index - lastWriteDotIndex + writePageCount) % writePageCount;
    animateWriteDots(forward <= writePageCount / 2 ? "next" : "prev");
  }
  lastWriteDotIndex = index;
}

function setWritePosition(index) {
  const host = $("writeList");
  host.style.scrollBehavior = "auto";
  host.style.scrollSnapType = "none";
  host.scrollLeft = index * host.clientWidth;
  requestAnimationFrame(() => {
    host.style.scrollBehavior = "";
    host.style.scrollSnapType = "";
  });
  updateWritePagination();
}

function restoreWritePosition() {
  const host = $("writeList");
  if (!host.clientWidth || !writePageCount) return;
  const pages = [...host.querySelectorAll(".write-page-card:not([data-clone])")];
  const index = Math.max(0, pages.findIndex(page => page.dataset.writeId === activeWritePageId));
  setWritePosition(writePageCount > 1 ? index + 1 : index);
}

function settleWriteLoop() {
  if (writeTouching || writePageCount < 2) return;
  const position = currentWriteIndex();
  if (position === 0) setWritePosition(writePageCount);
  else if (position === writePageCount + 1) setWritePosition(1);
}

function moveWriting(delta) {
  const host = $("writeList");
  if (writePageCount < 2) {
    animateWriteDots(delta > 0 ? "next" : "prev");
    return;
  }
  let position = currentWriteIndex();
  if (position === 0 || position === writePageCount + 1) {
    setWritePosition(position === 0 ? writePageCount : 1);
    position = currentWriteIndex();
  }
  const next = Math.max(0, Math.min(position + delta, writePageCount + 1));
  host.scrollTo({ left: next * host.clientWidth, behavior: "smooth" });
}

const inlineWriteSaveTimers = new Map();

async function saveInlineWritePage(id, content) {

  page.title = titleForWriter("未命名.txt", content);
  page.wordCount = content.replace(/\s/g, "").length;
  page.updatedAt = Date.now();
  if (!page.createdAt) page.createdAt = page.updatedAt;
  await putBook(page);
}

function queueInlineWriteSave(id, textarea) {
  clearTimeout(inlineWriteSaveTimers.get(id));
  inlineWriteSaveTimers.set(id, setTimeout(async () => {
    inlineWriteSaveTimers.delete(id);
    await saveInlineWritePage(id, textarea.value);
  }, 320));
}

async function removeWritingPage(id, event) {
  event?.preventDefault();
  event?.stopPropagation();
  clearTimeout(inlineWriteSaveTimers.get(id));
  inlineWriteSaveTimers.delete(id);
  const pages = (await getAllBooks())
    .filter(item => item.kind === "write")
    .sort((a, b) => (a.createdAt || a.updatedAt) - (b.createdAt || b.updatedAt));
  if (pages.length <= 1) return;
  const index = Math.max(0, pages.findIndex(item => item.id === id));
  await deleteBook(id);
  const remaining = pages.filter(item => item.id !== id);
  activeWritePageId = remaining[Math.min(index, remaining.length - 1)]?.id || null;
  await renderWriteList();
}

  host.innerHTML = "";

  $("writePagination").hidden = false;

  const createWritingPage = (page, clone = false) => {
    const card = document.createElement("article");
    card.className = "write-page-card write-inline-page swipe-delete-region";

    textarea.className = "write-inline-editor";
    textarea.value = page.content || "";

    textarea.tabIndex = clone ? -1 : 0;

    textarea.addEventListener("blur", async () => {
      clearTimeout(inlineWriteSaveTimers.get(page.id));
      inlineWriteSaveTimers.delete(page.id);
      await saveInlineWritePage(page.id, textarea.value);
    });
    surface.appendChild(textarea);

  if (books.length > 1) host.appendChild(createWritingPage(books[books.length - 1], true));
  books.forEach(page => host.appendChild(createWritingPage(page)));
  if (books.length > 1) host.appendChild(createWritingPage(books[0], true));

  const addedId = pendingAddedWriteId;
  if (addedId) {
    const addedCard = host.querySelector('.write-page-card:not([data-clone])[data-write-id="' + addedId + '"]');
    if (addedCard) {
      addedCard.classList.remove("page-added");
      void addedCard.offsetWidth;
      requestAnimationFrame(() => requestAnimationFrame(() => addedCard.classList.add("page-added")));
    }
  }
  pendingAddedWriteId = null;
}

function loadProfileAvatarElement(file) {
  return new Promise((resolve, reject) => {
    const objectUrl = URL.createObjectURL(file);
    const image = new Image();
    const cleanup = () => URL.revokeObjectURL(objectUrl);
    image.onload = () => {
      cleanup();
      resolve(image);
    };
    image.onerror = () => {
      cleanup();
      reject(new Error("invalid image"));
    };
    image.src = objectUrl;
  });
}

async function prepareProfileAvatar(file) {
  if (!file || (file.type && !file.type.startsWith("image/"))) {
    throw new Error("unsupported image");
  }
  let image;
  if ("createImageBitmap" in window) {
    try {
      image = await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch (error) {
      image = await loadProfileAvatarElement(file);
    }
  } else {
    image = await loadProfileAvatarElement(file);
  }
  const imageWidth = image.naturalWidth || image.width;
  const imageHeight = image.naturalHeight || image.height;
  if (!imageWidth || !imageHeight) {
    throw new Error("empty image");
  }
  const size = 256;
  const side = Math.min(imageWidth, imageHeight);
  const sx = (imageWidth - side) / 2;
  const sy = (imageHeight - side) / 2;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const context = canvas.getContext("2d");
  if (!context) throw new Error("canvas unavailable");
  context.fillStyle = "#ffffff";
  context.fillRect(0, 0, size, size);
  context.imageSmoothingEnabled = true;
  context.imageSmoothingQuality = "high";
  context.drawImage(image, sx, sy, side, side, 0, 0, size, size);
  if (typeof image.close === "function") image.close();
  return canvas.toDataURL("image/jpeg", .88);
}

let activeShelfBookId = null;
let pendingAddedBookId = null;
let shelfBookCount = 0;
let shelfScrollTimer = null;
let shelfLastScrollAt = 0;
let shelfSettleRetries = 0;
let shelfTouching = false;
let shelfPages = [];
let lastShelfDotIndex = null;
let shelfDotAnimationTimer = null;

function currentShelfIndex() {
  const shelf = $("shelf");
  return shelf.clientWidth ? Math.round(shelf.scrollLeft / shelf.clientWidth) : 0;
}

function updateShelfPagination() {
  const shelf = $("shelf");
  const width = shelf.clientWidth;
  if (!shelfBookCount || !width) return;
  const position = Math.round(shelf.scrollLeft / width);
  const index = shelfBookCount === 1 ? 0 : (position - 1 + shelfBookCount) % shelfBookCount;
  if (shelfPages[index]) activeShelfBookId = shelfPages[index].dataset.bookId;
  if (lastShelfDotIndex !== null && index !== lastShelfDotIndex && shelfBookCount > 1) {
    const forward = (index - lastShelfDotIndex + shelfBookCount) % shelfBookCount;
    animateShelfDots(forward <= shelfBookCount / 2 ? "next" : "prev");
  }
  lastShelfDotIndex = index;
}

function animateShelfDots(direction) {
  const dots = $("shelfDots");
  clearTimeout(shelfDotAnimationTimer);
  dots.classList.remove("moving-next", "moving-prev");
  void dots.offsetWidth;
  dots.classList.add(direction === "next" ? "moving-next" : "moving-prev");
  shelfDotAnimationTimer = setTimeout(() => dots.classList.remove("moving-next", "moving-prev"), 540);
}

function setShelfPosition(index) {
  const shelf = $("shelf");
  shelf.style.scrollBehavior = "auto";
  shelf.style.scrollSnapType = "none";
  shelf.scrollLeft = index * shelf.clientWidth;
  // 两帧之后再恢复 snap，避免 Safari 用旧位置重新吸附导致回弹
  requestAnimationFrame(() => requestAnimationFrame(() => {
    shelf.style.scrollBehavior = "";
    shelf.style.scrollSnapType = "";
  }));
  updateShelfPagination();
}

function restoreShelfPosition() {
  const shelf = $("shelf");
  if (!shelf.clientWidth || !shelfBookCount) return;
  const pages = [...shelf.querySelectorAll(".book-page:not([data-clone])")];
  const index = Math.max(0, pages.findIndex(page => page.dataset.bookId === activeShelfBookId));
  setShelfPosition(shelfBookCount > 1 ? index + 1 : index);
}

let shelfNormalizing = false;

function settleShelfLoop() {
  if (shelfTouching || shelfBookCount < 2) return;
  // iOS 松手后还有惯性滚动，位置还在变时归一化会造成来回跳动
  if (Date.now() - shelfLastScrollAt < 120) {
    if (shelfSettleRetries < 20) {
      shelfSettleRetries += 1;
      clearTimeout(shelfScrollTimer);
      shelfScrollTimer = setTimeout(settleShelfLoop, 120);
    }
    return;
  }
  shelfSettleRetries = 0;
  normalizeShelfLoop();
}

// 滚到首尾克隆页后，把位置平移到等价的正页（两侧内容完全相同，视觉无缝）。
// 关键：跳转时临时关闭 scroll-snap，否则 mandatory 吸附会把位置拽回克隆页，
// 循环就会卡在首尾，导致「切换不到数据页 / 回不到第一本」。
function normalizeShelfLoop() {
  const shelf = $("shelf");
  const width = shelf.clientWidth;
  if (!width || shelfBookCount < 2 || shelfNormalizing) return;
  const position = shelf.scrollLeft / width;
  let target = -1;
  if (position <= 0.001) target = shelfBookCount;
  else if (position >= shelfBookCount + 1 - 0.001) target = 1;
  if (target < 0) return;
  shelfNormalizing = true;
  setShelfPosition(target);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    shelfNormalizing = false;
  }));
}

function moveShelf(delta) {
  const shelf = $("shelf");
  if (shelfBookCount < 2) return;
  let next = currentShelfIndex() + delta;
  // 首尾直接跳到另一端正页，形成真正的无限循环
  if (next < 1) next = shelfBookCount;
  else if (next > shelfBookCount) next = 1;
  shelf.scrollTo({ left: next * shelf.clientWidth, behavior: "smooth" });
}

function renderBookPages(books, searchQuery = "") {

// 再逐本在空闲任务里解析并就地更新，避免添加书籍时卡住入场动画。
let shelfChapterInfoTimer = 0;
function updateShelfChapterInfo(book) {
  const chapters = parseChaptersCached(book);
  const title = currentChapterTitle(book, chapters);
  const progressValue = bookProgress(book, chapters);
  $("shelf").querySelectorAll('.book-page[data-book-id="' + book.id + '"]').forEach(page => {
    const chapterNode = page.querySelector(".book-page-chapter");
    if (chapterNode) chapterNode.textContent = title;
    const bar = page.querySelector(".book-page-progress");
    if (bar) bar.setAttribute("aria-valuenow", String(progressValue));
    const track = page.querySelector(".book-progress-track span");
    if (track) track.style.width = progressValue + "%";
  });
}
function scheduleShelfChapterInfo(books, delay = 60) {
  clearTimeout(shelfChapterInfoTimer);
  const pending = books.filter(book => !warmChapterCache(book));
  if (!pending.length) return;
  const step = () => {
    const book = pending.shift();
    if (!book) return;
    updateShelfChapterInfo(book);
    if (pending.length) shelfChapterInfoTimer = setTimeout(step, 40);
  };
  shelfChapterInfoTimer = setTimeout(step, delay);
}

// ============ 阅读器 ============
let currentBook = null;
let readerState = { chapters: [], current: 0 };
let readingSession = { bookId: null, startedAt: 0, monotonicStartedAt: 0 };
let readingHeartbeatTimer = 0;
const READING_HEARTBEAT_MS = 10000;

function readingSessionElapsed() {
  if (!readingSession.startedAt) return 0;
  const monotonicNow = performance.now();
  if (readingSession.monotonicStartedAt > 0 && monotonicNow >= readingSession.monotonicStartedAt) {
    return Math.max(0, monotonicNow - readingSession.monotonicStartedAt);
  }
  return Math.max(0, Date.now() - readingSession.startedAt);
}

function clearReadingHeartbeat() {
  if (!readingHeartbeatTimer) return;
  clearInterval(readingHeartbeatTimer);
  readingHeartbeatTimer = 0;
}

function startReadingHeartbeat() {
  clearReadingHeartbeat();
  readingHeartbeatTimer = setInterval(() => {
    if (!document.hidden && readingSession.bookId && readingSession.startedAt) flushReadingSession(true);
  }, READING_HEARTBEAT_MS);
}

function flushReadingSession(continueSession = false) {
  if (!readingSession.bookId || !readingSession.startedAt) return;
  const elapsed = Math.round(readingSessionElapsed());
  const stoppedAt = Date.now();
  if (elapsed > 0) {
    const total = storedReadingTime(readingSession.bookId) + elapsed;
    localStorage.setItem("reader:reading-time:" + readingSession.bookId, String(total));
    recordReadingInterval(Math.max(0, stoppedAt - elapsed), stoppedAt);
  }
  readingSession.startedAt = continueSession ? stoppedAt : 0;
  readingSession.monotonicStartedAt = continueSession ? performance.now() : 0;
}

function pauseReadingSession() {
  flushReadingSession(false);
  clearReadingHeartbeat();
}

function startReadingSession(bookId) {
  if (!bookId) return;
  if (readingSession.bookId !== bookId) {
    pauseReadingSession();
    readingSession.bookId = bookId;
  }
  if (!document.hidden && !readingSession.startedAt) {
    readingSession.startedAt = Date.now();
    readingSession.monotonicStartedAt = performance.now();
    startReadingHeartbeat();
  }
}

function stopReadingSession() {
  pauseReadingSession();
  readingSession.bookId = null;
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseReadingSession();
  else if (currentBook && !$("readerView").hidden) startReadingSession(currentBook.id);
});
window.addEventListener("blur", pauseReadingSession);
window.addEventListener("focus", () => {
  if (currentBook && !$("readerView").hidden) startReadingSession(currentBook.id);
});
document.addEventListener("freeze", pauseReadingSession);
document.addEventListener("resume", () => {
  if (currentBook && !$("readerView").hidden) startReadingSession(currentBook.id);
});
window.addEventListener("pagehide", pauseReadingSession);
window.addEventListener("beforeunload", pauseReadingSession);

let fontSize = 16;
let lineHeight = 1.9;
let theme = "gray";

function applyReaderStyle() {
  document.documentElement.style.setProperty("--font-size", fontSize + "px");
  document.documentElement.style.setProperty("--line-height", lineHeight);
  document.body.dataset.theme = theme;
}
function loadSettings() {
  const s = JSON.parse(localStorage.getItem("reader:settings") || "{}");
  const savedFontSize = Number(s.fontSize);
  fontSize = Number.isFinite(savedFontSize) && savedFontSize > 0 ? savedFontSize : 17;
  if (s.readerFontScaleVersion !== 2) fontSize = Math.max(12, fontSize - 1);
  lineHeight = s.lineHeight || 1.9;
  theme = s.theme === "night" ? "night" : "gray";
  if ($("lineHeightSel")) $("lineHeightSel").value = String(lineHeight);
  if ($("themeSel")) $("themeSel").value = theme;
  applyReaderStyle();
  if (s.readerFontScaleVersion !== 2) saveSettings();
}
function saveSettings() {
  localStorage.setItem("reader:settings", JSON.stringify({ fontSize, lineHeight, theme, readerFontScaleVersion: 2 }));
}
function changeFont(d) { fontSize = Math.min(30, Math.max(12, fontSize + d)); applyReaderStyle(); saveSettings(); }
function setLineHeight(v) { lineHeight = parseFloat(v); applyReaderStyle(); saveSettings(); }
function setTheme(v) { theme = v; applyReaderStyle(); saveSettings(); }

function renderTOC() {
  const toc = $("drawerToc");
  toc.innerHTML = "";
  readerState.chapters.forEach((ch, i) => {
    const b = document.createElement("button");
    b.textContent = ch.title;
    b.onclick = () => { jumpToChapter(i); closeDrawer(); };
    toc.appendChild(b);
  });
}

function highlightTOC() {
  const items = $("drawerToc").querySelectorAll("button");
  items.forEach((el, i) => el.classList.toggle("active", i === readerState.current));
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 懒加载渲染：只渲染已读到的章节，滚动到接近末尾时再补充，避免一次性渲染全文卡顿
let renderedUpTo = 0;
const RENDER_BATCH = 3;

function resetChapters() {
  renderedUpTo = 0;
  $("readerScroll").innerHTML = "";
}

function renderMoreChapters(count) {
  const host = $("readerScroll");
  const end = Math.min(readerState.chapters.length, renderedUpTo + count);
  if (end <= renderedUpTo) return false;
  let html = "";
  for (let i = renderedUpTo; i < end; i++) {
    const ch = readerState.chapters[i];
    html += '<div class="chapter" id="ch-' + i + '"><h2>' + escapeHtml(ch.title) + '</h2>';
    for (const p of ch.paras) html += '<p>' + escapeHtml(p) + '</p>';
    html += '</div>';
  }
  host.insertAdjacentHTML("beforeend", html);
  renderedUpTo = end;
  return renderedUpTo < readerState.chapters.length;
}

// 保证第 i 章已渲染（目录跳转 / 恢复进度时用）
function ensureRendered(i) {
  if (renderedUpTo > i) return;
  renderMoreChapters(i - renderedUpTo + 1);
}

function jumpToChapter(i) {
  readerState.current = i;
  ensureRendered(i);
  const el = document.getElementById("ch-" + i);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  highlightTOC();
  saveProgress();
}

function changeChapter(direction) {
  const next = readerState.current + direction;
  if (next < 0) { showToast("已经是第一章"); return; }
  if (next >= readerState.chapters.length) { showToast("已经是最后一章"); return; }
  jumpToChapter(next);
}

function openBook(book) {
  currentBook = book;
  readerState.chapters = parseChapters(book.content);
  if (readerState.chapters.length === 0) {
    readerState.chapters = [{ title: "正文", paras: book.content.split(/\r?\n/).map(s => s.trim()).filter(Boolean) }];
  }
  $("bookTitle").textContent = book.title;
  renderTOC();
  const saved = JSON.parse(localStorage.getItem("reader:progress:" + book.id) || "null");
  const start = (saved && saved.current < readerState.chapters.length) ? saved.current : 0;
  readerState.current = start;
  resetChapters();
  renderMoreChapters(3);   // 先渲染开头几章，保证快速进入
  ensureRendered(start);   // 若恢复位置较靠后，渲染到该章
  switchTab("reader");
  showInReaderTab("reader");   // 隐藏底部导览条
  setControls(false);          // 进入沉浸态（控制条隐藏）
  requestAnimationFrame(() => {
    fitSingleLineTitle($("bookTitle"), 10);
    highlightTOC();
    const el = document.getElementById("ch-" + start);
    if (el) {
      const off = (saved && typeof saved.chapterOffset === "number") ? saved.chapterOffset : 0;
      $("readerScroll").scrollTop = el.offsetTop + off;
    }
  });
}

function exitReader() {
  if (progressTimer) { clearTimeout(progressTimer); progressTimer = null; }
  saveProgress();
  stopReadingSession();
  showInReaderTab("shelf");
  renderShelf();
}

let controlsOpen = false;

$("readerScroll").addEventListener("click", (e) => {

let progressTimer = null;
$("readerScroll").addEventListener("scroll", () => {
  const host = $("readerScroll");
  const els = host.querySelectorAll(".chapter");
  let cur = 0;
  els.forEach((el, i) => { if (el.offsetTop <= host.scrollTop + 80) cur = i; });
  if (cur !== readerState.current) { readerState.current = cur; highlightTOC(); }
  // 接近已渲染内容末尾时，追加渲染下一批章节
  if (host.scrollTop + host.clientHeight > host.scrollHeight - 2000) {
    renderMoreChapters(RENDER_BATCH);
  }
  if (progressTimer) clearTimeout(progressTimer);
  progressTimer = setTimeout(saveProgress, 300);
});

function saveProgress() {
  if (!currentBook) return;
  const host = $("readerScroll");
  // 记录「当前章节内」的滚动偏移，精确到段落位置，而不只是章节序号
  let chapterOffset = 0;
  const el = document.getElementById("ch-" + readerState.current);
  if (el) chapterOffset = Math.max(0, host.scrollTop - el.offsetTop);
  const chapterLengths = readerState.chapters.map(chapter =>
    chapter.paras.reduce((sum, paragraph) => sum + paragraph.replace(/\s/g, "").length, 0)
  );
  const totalLength = chapterLengths.reduce((sum, length) => sum + length, 0);
  let completedLength = chapterLengths.slice(0, readerState.current).reduce((sum, length) => sum + length, 0);
  if (el) {
    const readingY = host.getBoundingClientRect().top + Math.min(120, host.clientHeight * .2);
    const paragraphs = [...el.querySelectorAll("p")];
    const sourceParagraphs = readerState.chapters[readerState.current].paras;
    paragraphs.forEach((paragraph, index) => {
      const length = (sourceParagraphs[index] || "").replace(/\s/g, "").length;
      const rect = paragraph.getBoundingClientRect();
      if (rect.bottom <= readingY) completedLength += length;
      else if (rect.top < readingY && rect.height > 0) {
        completedLength += length * Math.min(1, Math.max(0, (readingY - rect.top) / rect.height));
      }
    });
  }
  let percent = totalLength ? (completedLength / totalLength) * 100 : 0;
  if (host.scrollTop + host.clientHeight >= host.scrollHeight - 2 && renderedUpTo >= readerState.chapters.length) {
    percent = 100;
  }
  localStorage.setItem("reader:progress:" + currentBook.id, JSON.stringify({
    current: readerState.current,
    scrollTop: host.scrollTop,
    chapterOffset: chapterOffset,
    percent: Math.min(100, Math.max(0, percent)),
  }));
}

$("readerFileInput").addEventListener("change", async (e) => {

  if (!file) return;
  try {
    // 先弹信息弹窗（标题直接用文件名），把耗时最长的文件解析放到确认之后，
    // 这样「添加」的动效和弹窗不会被主线程阻塞。
    const isEpub = /\.epub$/i.test(file.name) || file.type === "application/epub+zip";
    const fallbackTitle = file.name.replace(/\.epub$/i, "").replace(/\.(?:txt|text)$/i, "");
    const info = await showBookInfoDialog(fallbackTitle.trim() || "未命名");
    if (!info) { e.target.value = ""; return; }
    showToast("正在导入…");
    await new Promise(resolve => setTimeout(resolve, 16));
    const buffer = await readFileAsArrayBuffer(file);
    const imported = isEpub
      ? await extractEpubBook(buffer, fallbackTitle)
      : { content: decodeBest(buffer), coverDataUrl: "" };
    const text = imported.content;
    if (!text) { showToast("无法读取文件内容"); return; }
    // 只读取一次全库数据，导入与渲染共用，避免连续三次反序列化整库
    const allBooks = await getAllBooks();
    const id = await importBook(info.title, text, imported.coverDataUrl, allBooks);
    activeShelfBookId = id;
    pendingAddedBookId = id;
    showInReaderTab("shelf");
    await renderShelf(allBooks);
    showToast("已导入");
  } catch (err) {
    console.error("Book import failed", err);
    showToast("导入失败");
  }
  e.target.value = "";
});
