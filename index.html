<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ReadBook">
<meta name="theme-color" content="#f5f5f5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180v2.png">
<title>ReadBook</title>
<style>
  :root {
    --bg: #eef0f3;
    --panel: #fbfbfc;
    --card: #ffffff;
    --text: #333;
    --text-soft: #98a0ab;
    --accent: #4a6cf7;
    --accent-soft: #eef1fe;
    --border: #e6e9ee;
    --shadow: 0 1px 3px rgba(20,24,34,.06), 0 8px 24px rgba(20,24,34,.05);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "Source Han Sans SC", "Noto Sans SC", "Noto Sans CJK SC", "思源黑体", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 700;
    color: var(--text);
    background: var(--bg);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  main { flex: 1; min-height: 0; display: flex; }
  .tab-page { flex: 1; min-width: 0; display: flex; flex-direction: column; animation: pageIn .22s ease; }
  .tab-page[hidden] { display: none; }
  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }

  /* 各视图容器：统一纵向 flex 布局，hidden 属性时隐藏 */
  #shelfView, #statsView, #readerView, #writeListView, #editorView, #profileView {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #shelfView[hidden], #statsView[hidden], #readerView[hidden], #writeListView[hidden], #editorView[hidden], #profileView[hidden] { display: none; }

  /* ===== 底部导航 ===== */
  footer {
    flex: none;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    margin: 0 14px;
    margin-bottom: calc(20px + env(safe-area-inset-bottom));
    border-radius: 24px;
    background: var(--panel);
    background: color-mix(in srgb, var(--panel) 55%, transparent);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    box-shadow: 0 6px 22px rgba(20,24,34,.08);
    padding: 13px 14px;
  }
  footer .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 8px 0;
    cursor: pointer;
    color: var(--text-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 12px;
    transition: color .18s;
  }
  footer .tab-btn svg { width: 23px; height: 23px; stroke-width: 1.8; }
  footer .tab-btn.active { color: var(--accent); font-weight: 700; }
  footer .add-btn {
    flex: none;
    width: 52px;
    height: 52px;
    margin: 0 14px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: transparent;
    color: var(--text);
    box-shadow: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  footer .add-btn svg { width: 26px; height: 26px; stroke-width: 2.4; }
  footer .add-btn:active { transform: scale(.94); }

  /* ===== 通用标题栏 ===== */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 14px 18px;
    padding-top: calc(22px + env(safe-area-inset-top));
    flex: none;
    flex-wrap: wrap;
  }
  .toolbar .title { font-weight: 700; font-size: 17px; letter-spacing: .3px; line-height: 34px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar .sub, .toolbar .wordcount { font-size: 13px; line-height: 34px; color: var(--text-soft); }
  .toolbar .spacer { flex: 1; }
  .toolbar button, .toolbar select {
    font-size: 13px;
    padding: 7px 13px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 9px;
    cursor: pointer;
    color: var(--text);
  }
  .toolbar button:active { transform: scale(.97); }
  .toolbar .add-mini {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: transparent;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toolbar .add-mini svg { width: 18px; height: 18px; stroke-width: 2; }
  .toolbar .add-mini:active { transform: scale(.94); }

  /* ===== 列表（书架 / 写作） ===== */
  .shelf {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px 24px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    align-content: start;
  }
  .book-card { display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .book-card .cover {
    position: relative;
    aspect-ratio: unset;
    width: 100%;
    height: auto;
    min-height: 56px;
    padding: 13px 14px;
    border-radius: 24px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    box-shadow: var(--shadow);
    /* 玻璃态：半透明白色描边 + 背景模糊 */
    border: 1px solid rgba(255,255,255,.28);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    overflow: hidden;
  }
  .book-card .cover .cover-title {
    flex: 1;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.4;
    text-align: left;
    position: relative;
    z-index: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-all;
  }
  .book-card .cover .ops {
    position: static;
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    z-index: 1;
  }
  .book-card .cover .op {
    border: none;
    background: rgba(255,255,255,.92);
    color: #6b7280;
    font-size: 11px;
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .book-card .info {
    padding: 0 14px;
    font-size: 12px;
    color: var(--text-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .empty {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    color: var(--text-soft);
    font-size: 14px;
    padding: 80px 20px;
    text-align: center;
  }
  .empty svg { width: 72px; height: 72px; stroke: var(--text-soft); stroke-width: 1.4; opacity: .6; }

  /* ===== 阅读器（沉浸式） ===== */
  .reader-body { flex: 1; min-height: 0; position: relative; }
  .reader-scroll {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: calc(30px + env(safe-area-inset-top)) 22px calc(90px + env(safe-area-inset-bottom));
    /* 小说正文：保持原字体与常规字重，不随界面加粗/改字体 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: normal;
  }
  .chapter { max-width: 720px; margin: 0 auto 44px; }
  .chapter h2 {
    font-size: 23px;
    margin: 12px 0 22px;
    padding: 0 0 12px 14px;
    border-bottom: 1px solid var(--border);
    position: relative;
    display: flex;
    align-items: center;
  }
  .chapter h2::before {
    content: '';
    position: absolute;
    left: 0;
    width: 4px;
    height: 1.2em;
    background: var(--accent);
    border-radius: 3px;
  }
  .chapter p {
    margin: 0 0 16px;
    line-height: var(--line-height, 1.9);
    font-size: var(--font-size, 17px);
    text-align: justify;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  /* 阅读器内的顶部 / 底部控制条（点击正文弹出） */
  .reader-bar {
    position: absolute;
    left: 0;
    right: 0;
    z-index: 15;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  .reader-bar.show { opacity: 1; pointer-events: auto; }
  .reader-top {
    top: 0;
    transform: translateY(-100%);
    padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: rgba(251,251,252,.88);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .reader-top.show { transform: translateY(0); }
  .reader-top .title { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .reader-bottom {
    bottom: 0;
    transform: translateY(100%);
    justify-content: center;
    flex-wrap: wrap;
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(251,251,252,.22);   /* 透明导览条 */
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border-top: 1px solid rgba(20,24,34,.05);
  }
  .reader-bottom.show { transform: translateY(0); }
  .reader-bar button, .reader-bar select {
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 9px;
    cursor: pointer;
    color: var(--text);
  }
  .reader-bar button.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--accent);
  }
  .reader-top button { background: transparent; border-color: transparent; color: var(--accent); font-size: 14px; padding: 6px 8px; }

  /* 顶部控制条：浮动卡片（阅读与写作保持一致，悬浮在内容上方、不贴边） */
  #editorTop, #readerTop {
    top: calc(12px + env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 18px;
    background: rgba(251,251,252,.86);
    box-shadow: 0 10px 30px rgba(20,24,34,.16);
    transform: translateY(-140%);
    flex-wrap: wrap;
    row-gap: 8px;
  }
  #editorTop.show, #readerTop.show { transform: translateY(0); }

  /* 目录抽屉 */
  .drawer-mask {
    position: absolute;
    inset: 0;
    background: rgba(15,18,28,.4);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .drawer-mask.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 300px;
    max-width: 88%;
    background: var(--panel);
    border-right: 1px solid var(--border);
    box-shadow: 4px 0 30px rgba(20,24,34,.12);
    z-index: 21;
    transform: translateX(-100%);
    transition: transform .24s cubic-bezier(.4,0,.2,1);
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .drawer-head {
    display: flex;
    align-items: center;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top));
    font-weight: 700;
    font-size: 15px;
    flex: none;
  }
  .drawer .drawer-head .spacer { flex: 1; }
  .drawer .drawer-head button {
    border: none; background: transparent; cursor: pointer;
    color: var(--text-soft); font-size: 14px; padding: 2px 6px;
  }
  .drawer-toc { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 10px; }
  .drawer-toc button {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: transparent;
    padding: 9px 11px;
    font-size: 13px;
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .drawer-toc button:active { background: var(--accent-soft); }
  .drawer-toc button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .drawer-settings {
    flex: none;
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .drawer-settings button, .drawer-settings select {
    font-size: 13px;
    padding: 7px 11px;
    border: 1px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    cursor: pointer;
    color: var(--text);
  }

  /* ===== 写作 ===== */
  .editor-body {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .editor {
    flex: 1;
    min-height: 0;
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    padding: calc(34px + env(safe-area-inset-top)) 28px 40px;
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    font-weight: normal;
    font-size: 16px;
    line-height: 1.95;
    color: var(--text);
    background: var(--panel);
  }
  .reader-top .wordcount { font-size: 12px; color: var(--text-soft); white-space: nowrap; }
  .editor::placeholder { color: #c2c8d1; }
  .editor-mirror {
    position: absolute;
    top: 0;
    left: 0;
    visibility: hidden;
    pointer-events: none;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .editor-fab {
    position: absolute;
    top: calc(8px + env(safe-area-inset-top));
    right: 12px;
    z-index: 14;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(251,251,252,.7);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--text-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .18s ease;
  }
  .editor-fab svg { width: 20px; height: 20px; stroke-width: 1.9; }

  /* ===== 弹窗 / 提示 ===== */
  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(15,18,28,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-box {
    background: var(--panel);
    border-radius: 16px;
    padding: 22px 20px 16px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal-msg { font-size: 15px; margin-bottom: 16px; line-height: 1.6; }
  .modal-input {
    width: 100%;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 16px;
    outline: none;
    color: var(--text);
    background: var(--card);
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button {
    padding: 8px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
  }
  .modal-actions .m-ok { background: transparent; color: var(--accent); }

  .toast {
    position: fixed;
    left: 0; right: 0;
    bottom: 90px;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 120;
  }
  .toast-inner {
    background: rgba(30,32,40,.92);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .25s, transform .25s;
    max-width: 80%;
  }
  .toast.show .toast-inner { opacity: 1; transform: translateY(0); }

  /* 主题 */
  body[data-theme="gray"]  { --bg:#eef0f3; --panel:#fbfbfc; --card:#ffffff; --text:#333; --text-soft:#98a0ab; --accent-soft:#eef1fe; --border:#e6e9ee; }
  body[data-theme="sepia"] { --bg:#efe3cd; --panel:#faf3e3; --card:#fffaf0; --text:#4a3f2f; --text-soft:#a3957e; --accent:#c98a3d; --accent-soft:#f3e6d4; --border:#e6d7bd; }
  body[data-theme="night"] { --bg:#131419; --panel:#1c1d24; --card:#22232c; --text:#d8d8dd; --text-soft:#6d7480; --accent:#7c96ff; --accent-soft:#232633; --border:#2c2d37; }
  body[data-theme="green"]  { --bg:#e2ece3; --panel:#f2f7f2; --card:#ffffff; --text:#2f3b2f; --text-soft:#8ba08b; --accent:#4d8c57; --accent-soft:#e3efe5; --border:#d3e0d4; }
  body[data-theme="light"]  { --bg:#f5f6f8; --panel:#ffffff; --card:#ffffff; --text:#222; --text-soft:#9aa0aa; --accent:#4a6cf7; --accent-soft:#eef1fe; --border:#e8eaee; }
</style>
<style>
/* Visual layer: a quieter bookshelf and a paper-like reading surface. */
:root {
  --reader-font: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --ui-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  --book-title-font: "Taipei Sans TC Beta", "Taipei Sans TC", "台北黑体", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
}

body[data-theme="gray"] {
  --bg: #f6f6f5;
  --panel: #fafafa;
  --card: #ffffff;
  --reading-surface: #ffffff;
  --text: #111111;
  --text-soft: #9b9b9b;
  --accent: #111111;
  --accent-soft: #f0f0ef;
  --border: #e9e9e7;
  --overlay: rgba(250, 249, 246, .96);
  --shadow: 0 10px 28px rgba(31, 48, 56, .055);
}
body[data-theme="light"] {
  --bg: #f0f4f6;
  --panel: #f7fafb;
  --card: #fff;
  --reading-surface: #fff;
  --text: #25313c;
  --text-soft: #657782;
  --accent: #376483;
  --accent-soft: #e6f0f6;
  --border: #dbe4e8;
  --overlay: rgba(255, 255, 255, .96);
  --shadow: 0 10px 28px rgba(30, 53, 69, .06);
}
body[data-theme="sepia"] {
  --bg: #e9dfcd;
  --panel: #f3ebdc;
  --card: #fbf4e6;
  --reading-surface: #f8f0df;
  --text: #483b2c;
  --text-soft: #776a56;
  --accent: #9b6837;
  --accent-soft: #eee0ca;
  --border: #ded1ba;
  --overlay: rgba(251, 244, 230, .96);
  --shadow: 0 10px 28px rgba(72, 59, 44, .07);
}
body[data-theme="green"] {
  --bg: #e7eee8;
  --panel: #f2f7f2;
  --card: #fcfefb;
  --reading-surface: #f6faf5;
  --text: #30443b;
  --text-soft: #647d6d;
  --accent: #4f7861;
  --accent-soft: #e1ece2;
  --border: #d4e2d5;
  --overlay: rgba(247, 251, 246, .96);
  --shadow: 0 10px 28px rgba(43, 68, 52, .06);
}
body[data-theme="night"] {
  --bg: #0f0f0f;
  --panel: #171717;
  --card: #1d1d1d;
  --reading-surface: #141414;
  --text: #f2f2ef;
  --text-soft: #989898;
  --accent: #f2f2ef;
  --accent-soft: #2a2a2a;
  --border: #303030;
  --overlay: rgba(23, 23, 23, .97);
  --shadow: none;
}

body { font-family: var(--ui-font); font-weight: 400; }
button, select, input, textarea { font: inherit; }
button:focus-visible, select:focus-visible, .book-card:focus-visible, .book-page:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* Library and writing list */
.toolbar {
  padding: calc(35px + env(safe-area-inset-top)) clamp(22px, 5vw, 48px) 15px;
  gap: 8px 12px;
}
.toolbar .title {
  font-family: var(--reader-font);
  font-size: clamp(28px, 6vw, 36px);
  font-weight: 600;
  letter-spacing: .08em;
  line-height: 1.25;
}
.toolbar .sub, .toolbar .wordcount {
  align-self: end;
  color: var(--text-soft);
  font-size: 12px;
  font-weight: 500;
  line-height: 28px;
}
.toolbar .add-mini {
  width: 42px;
  height: 42px;
  background: var(--accent);
  color: var(--card);
  border: 0;
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.toolbar .add-mini svg { width: 20px; height: 20px; }
.shelf {
  padding: 16px clamp(20px, 5vw, 48px) 38px;
  gap: 14px;
  max-width: 1100px;
  width: 100%;
  margin-inline: auto;
}
.book-card {
  min-width: 0;
  gap: 0;
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  transition: transform .18s ease, box-shadow .18s ease;
}
.book-card:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(31, 48, 56, .11); }
.book-card:active { transform: translateY(0); }
.book-card .cover {
  min-height: 104px;
  padding: 22px 20px 10px 26px;
  gap: 12px;
  align-items: flex-start;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
.book-card .cover::before {
  content: "";
  position: absolute;
  top: 22px;
  bottom: 12px;
  left: 13px;
  width: 4px;
  border-radius: 5px;
  background: var(--cover-accent, var(--accent));
}
.book-card .cover .cover-title {
  min-width: 0;
  color: var(--text);
  font-family: var(--book-title-font);

}
.book-card .cover .ops { gap: 5px; }
.book-card .cover .op {

  background: transparent;
  color: var(--text-soft);
  font-size: 12px;
  border-radius: 8px;
}
.book-card .cover .op:hover { background: var(--accent-soft); color: var(--accent); }
.book-card .info {

  font-weight: 400;
}
.empty {
  min-height: 45vh;
  padding: 40px 20px;
  line-height: 1.8;
}
.empty svg { width: 62px; height: 62px; opacity: .65; }
@media (min-width: 700px) {
  .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* Bottom navigation */
footer {
  max-width: 460px;
  width: calc(100% - 36px);
  margin: 0 auto calc(15px + env(safe-area-inset-bottom));
  padding: 7px 10px;
  border-radius: 22px;
  background: var(--overlay);
  border-color: var(--border);
  box-shadow: 0 10px 34px rgba(22, 38, 46, .12);
}
footer .tab-btn {

  gap: 3px;

  font-weight: 500;
}
footer .tab-btn.active { color: var(--accent); }
footer .add-btn {
  width: 48px;
  height: 48px;
  margin: 0 8px;
  border: 0;
  border-radius: 15px;

}

/* Reading and writing */
.reader-scroll {
  background: var(--reading-surface);
  padding: calc(42px + env(safe-area-inset-top)) clamp(24px, 6vw, 60px)
    calc(95px + env(safe-area-inset-bottom));

  color: var(--text);
}
.chapter { max-width: 680px; margin-bottom: 66px; }
.chapter h2 {
  display: block;
  margin: 14px 0 38px;
  padding: 0 0 22px;
  border-bottom: 1px solid var(--border);
  font-family: var(--reader-font);
  font-size: clamp(22px, 5vw, 28px);
  font-weight: 600;
  line-height: 1.5;
  text-align: center;
  letter-spacing: .05em;
}
.chapter h2::before {
  content: "· 章 节 ·";
  display: block;
  position: static;
  width: auto;
  height: auto;
  margin: 0 0 16px;
  background: transparent;
  color: var(--accent);
  font-family: var(--ui-font);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .25em;
}
.chapter p {
  margin-bottom: 1.15em;
  line-height: var(--line-height, 1.9);
  letter-spacing: .025em;
  text-align: justify;
  text-justify: inter-ideograph;
}
#readerTop, #editorTop {
  left: clamp(12px, 3vw, 28px);
  right: clamp(12px, 3vw, 28px);
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--overlay);
  box-shadow: 0 12px 32px rgba(22, 38, 46, .15);
}
.reader-top .title {
  font-family: var(--reader-font);
  font-size: 15px;
  font-weight: 600;
}
.reader-top button { color: var(--accent); font-weight: 600; }
.reader-bottom {
  left: clamp(12px, 3vw, 28px);
  right: clamp(12px, 3vw, 28px);
  bottom: calc(12px + env(safe-area-inset-bottom));
  transform: translateY(calc(100% + 28px));
  padding: 10px 12px;
  background: var(--overlay);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 12px 32px rgba(22, 38, 46, .15);
  gap: 8px;
}
.reader-bar button, .reader-bar select {
  min-height: 39px;
  border-radius: 10px;
  background: var(--card);
}
.drawer { background: var(--panel); border-color: var(--border); }
.drawer .drawer-head {
  font-family: var(--reader-font);
  font-size: 19px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.drawer-toc { padding: 14px 12px; }
.drawer-toc button { padding: 12px; line-height: 1.5; }
.drawer-toc button.active { background: var(--accent-soft); }

.editor {
  padding: calc(74px + env(safe-area-inset-top)) clamp(24px, 6vw, 60px) 50px;
  background: var(--reading-surface);
  font-family: var(--reader-font);
  font-size: 17px;
  line-height: 1.95;
}
.editor::placeholder { color: var(--text-soft); opacity: .9; }
.editor-fab {
  top: calc(18px + env(safe-area-inset-top));
  right: 18px;
  border-color: var(--border);
  background: var(--overlay);
  color: var(--accent);
  box-shadow: var(--shadow);
}
.modal-box {
  max-width: 360px;
  border: 1px solid var(--border);
  border-radius: 18px;
}
.modal-actions button { min-height: 40px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* Editorial home screen inspired by the supplied monochrome reference. */
body[data-theme="gray"] {
  --bg: #f5f5f5;
  --panel: #fafafa;
  --card: #fff;
  --reading-surface: #fff;
  --text: #181818;
  --text-soft: #777;
  --accent: #242424;
  --accent-soft: #f0f0f0;
  --border: #eeeeee;
  --overlay: rgba(255, 255, 255, .97);
  --shadow: 0 14px 32px rgba(0, 0, 0, .045);
}
body[data-theme="light"] {
  --bg: #fff;
  --panel: #fff;
  --card: #fff;
  --reading-surface: #fff;
  --text: #121212;
  --text-soft: #727272;
  --accent: #222;
  --accent-soft: #f4f4f4;
  --border: #ededed;
  --overlay: rgba(255, 255, 255, .97);
  --shadow: 0 14px 32px rgba(0, 0, 0, .04);
}
body[data-theme="night"] {
  --bg: #17191b;
  --panel: #1d2022;
  --card: #25282a;
  --reading-surface: #1b1e20;
  --text: #f1f0eb;
  --text-soft: #a4a6a6;
  --accent: #f1f0eb;
  --accent-soft: #393d3e;
  --border: #363a3b;
  --overlay: rgba(37, 40, 42, .97);
  --shadow: 0 14px 32px rgba(0, 0, 0, .19);
}

#shelfView { background: var(--bg); }
.home-head {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: calc(40px + env(safe-area-inset-top)) clamp(22px, 5vw, 48px) 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
}
.home-copy {
  min-width: 0;
  min-height: 52px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.home-head h1 {
  margin: 0;
  font-family: var(--ui-font);
  font-size: clamp(23px, 5vw, 30px);
  font-weight: 700;
  line-height: 1.12;
  letter-spacing: -.045em;
}
.home-subtitle {
  margin: 0;
  color: var(--text-soft);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: .01em;
}
.home-add-btn {
  flex: none;
  align-self: center;
  width: 52px;
  height: 52px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
  box-shadow: none;
}
.home-add-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }
.home-add-btn:active { transform: scale(.95); }
.shelf { gap: 16px; padding-top: 16px; padding-bottom: 34px; }
.book-card {
  border-radius: 24px;
  border-color: var(--border);
  box-shadow: var(--shadow);
}
.book-card .cover .cover-title {
  font-family: var(--ui-font);
  font-size: 19px;
  font-weight: 650;
  letter-spacing: -.02em;
}
.book-card .cover::before { background: var(--text-soft); opacity: .5; }

footer {
  width: calc(100% - 40px);
  max-width: 470px;
  gap: 12px;
  align-items: stretch;
  padding: 0;
  margin-bottom: calc(18px + env(safe-area-inset-bottom));
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
footer .tab-pill {
  position: relative;
  isolation: isolate;
  flex: 1;
  min-width: 0;
  height: 59px;
  min-height: 59px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
footer .tab-liquid {
  position: absolute;
  z-index: 0;
  top: 6px;
  bottom: 6px;
  left: 6px;
  right: 6px;
  pointer-events: none;
  filter: url(#tabLiquidGoo);
  opacity: 1;
  transition: opacity .18s ease;
}
footer .tab-liquid-blob {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: calc((100% - 4px) / 2);
  border-radius: 999px;
  background: var(--accent-soft);
  transform: translateX(0) scaleX(1);
  transform-origin: center;
  will-change: transform, border-radius;
}
footer .tab-liquid-drop {
  position: absolute;
  top: 50%;
  width: 18px;
  height: 18px;
  margin-top: -9px;
  border-radius: 50%;
  background: var(--accent-soft);
  opacity: 0;
  will-change: left, transform, opacity, border-radius;
}
footer .tab-pill[data-active="writer"] .tab-liquid-blob {
  transform: translateX(calc(100% + 4px)) scaleX(1);
}
footer .tab-pill.profile-selected .tab-liquid { opacity: 0; }
footer .tab-pill.squeeze-to-writer .tab-liquid-blob {
  animation: tab-liquid-to-writer .55s cubic-bezier(.22, .68, .18, 1) both;
}
footer .tab-pill.squeeze-to-writer .tab-liquid-drop {
  left: calc(25% - 9px);
  right: auto;
  animation: tab-drop-to-writer .55s cubic-bezier(.22, .68, .18, 1) both;
}
footer .tab-pill.squeeze-to-reader .tab-liquid-blob {
  animation: tab-liquid-to-reader .55s cubic-bezier(.22, .68, .18, 1) both;
}
footer .tab-pill.squeeze-to-reader .tab-liquid-drop {
  left: calc(75% - 9px);
  right: auto;
  animation: tab-drop-to-reader .55s cubic-bezier(.22, .68, .18, 1) both;
}
@keyframes tab-liquid-to-writer {
  0% { transform: translateX(0) scaleX(1) scaleY(1); border-radius: 999px; }
  28% { transform: translateX(0) scaleX(1) scaleY(1); border-radius: 999px; }
  46% { transform: translateX(22%) scaleX(1.08) scaleY(.82); border-radius: 55% 45% 45% 55%; }
  74% { transform: translateX(75%) scaleX(1.06) scaleY(1.1); border-radius: 53% 47% 47% 53%; }
  100% { transform: translateX(calc(100% + 4px)) scaleX(1) scaleY(1); border-radius: 999px; }
}
@keyframes tab-liquid-to-reader {
  0% { transform: translateX(calc(100% + 4px)) scaleX(1) scaleY(1); border-radius: 999px; }
  28% { transform: translateX(calc(100% + 4px)) scaleX(1) scaleY(1); border-radius: 999px; }
  46% { transform: translateX(78%) scaleX(1.08) scaleY(.82); border-radius: 45% 55% 55% 45%; }
  74% { transform: translateX(25%) scaleX(1.06) scaleY(1.1); border-radius: 47% 53% 53% 47%; }
  100% { transform: translateX(0) scaleX(1) scaleY(1); border-radius: 999px; }
}
@keyframes tab-drop-to-writer {
  0% { left: calc(25% - 9px); opacity: 0; transform: scale(.25); border-radius: 50%; }
  12% { left: calc(25% - 9px); opacity: .85; transform: scale(.48); border-radius: 50%; }
  38% { left: calc(52% - 9px); opacity: 1; transform: scaleX(1.35) scaleY(.72); border-radius: 46% 64% 64% 46%; }
  62% { left: calc(75% - 9px); opacity: 1; transform: scaleX(.9) scaleY(1.18); border-radius: 54% 46% 46% 54%; }
  78% { left: calc(75% - 9px); opacity: 0; transform: scale(.55); border-radius: 50%; }
  100% { left: calc(75% - 9px); opacity: 0; transform: scale(.25); border-radius: 50%; }
}
@keyframes tab-drop-to-reader {
  0% { left: calc(75% - 9px); opacity: 0; transform: scale(.25); border-radius: 50%; }
  12% { left: calc(75% - 9px); opacity: .85; transform: scale(.48); border-radius: 50%; }
  38% { left: calc(48% - 9px); opacity: 1; transform: scaleX(1.35) scaleY(.72); border-radius: 64% 46% 46% 64%; }
  62% { left: calc(25% - 9px); opacity: 1; transform: scaleX(.9) scaleY(1.18); border-radius: 46% 54% 54% 46%; }
  78% { left: calc(25% - 9px); opacity: 0; transform: scale(.55); border-radius: 50%; }
  100% { left: calc(25% - 9px); opacity: 0; transform: scale(.25); border-radius: 50%; }
}
footer .tab-btn {
  position: relative;
  z-index: 1;
  min-height: 45px;
  flex-direction: row;
  justify-content: center;
  line-height: 1;
  border-radius: 999px;

footer .tab-btn span {

.toolbar .title { font-family: var(--ui-font); font-weight: 700; letter-spacing: -.04em; }

<script>
"use strict";

// ============ 通用工具 ============

const storage = window.localStorage;
const $ = (id) => document.getElementById(id);
const genId = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);

const TITLE_RE = /^[\s\u3000]*(?:(?:第[零一二三四五六七八九十百千万两〇0-9０-９]+[章節节卷回篇部集])|序章|序言|序曲|前言|引子|引言|楔子|尾声|尾聲|终章|終章|后记|後記|后序|结语|結語|番外|(?:Chapter|CHAPTER|Part|PART)\s*\d+|卷[零一二三四五六七八九十百千万两〇0-9０-９]+).*$/;

function decodeBest(buffer) {
  const u8 = new Uint8Array(buffer);
  if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) {
    return new TextDecoder("utf-8").decode(buffer.subarray(3));
  }
  if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xFE) {
    return new TextDecoder("utf-16le").decode(buffer.subarray(2));
  }
  if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) {
    return new TextDecoder("utf-16be").decode(buffer.subarray(2));
  }
  const candidates = ["utf-8", "gb18030", "big5"];
  for (const enc of candidates) {
    try { return new TextDecoder(enc, { fatal: true }).decode(buffer); }
    catch (e) { /* 尝试下一个编码 */ }
  }
  return new TextDecoder("utf-8").decode(buffer);
}

function parseChapters(text) {
  const lines = text.split(/\r?\n/);
  const chapters = [];
  let cur = null;
  for (const line of lines) {
    if (TITLE_RE.test(line)) {
      if (cur) chapters.push(cur);
      cur = { title: line.trim() || "正文", paras: [] };
    } else {
      if (!cur) cur = { title: "正文", paras: [] };
      const t = line.trim();
      if (t) cur.paras.push(t);
    }
  }
  if (cur) chapters.push(cur);
  return chapters;
}

function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsArrayBuffer(file);
  });
}

function formatCount(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + " 万字";
  return n + " 字";
}
function formatTime(ts) {
  return new Date(ts).toLocaleString("zh-CN", {
    month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
  });
}
function bookAuthor(book) {
  if (book.author && book.author.trim()) return book.author.trim();
  const parts = book.title.split(/\s*[-—_]\s*/).filter(Boolean);
  return parts.length > 1 ? parts[parts.length - 1] : "Anonymous";
}
function storedReadingTime(bookId) {
  const value = Number(storage.getItem("reader:reading-time:" + bookId));
  return Number.isFinite(value) && value > 0 ? value : 0;
}
function liveReadingTime(bookId) {
  let total = storedReadingTime(bookId);
  if (readingSession.bookId === bookId && readingSession.startedAt) {
    total += Math.max(0, Date.now() - readingSession.startedAt);
  }
  return total;
}
function formatReadingTime(milliseconds) {
  if (milliseconds <= 0) return "0 min";
  if (milliseconds < 60000) return "<1 min";
  const totalMinutes = Math.floor(milliseconds / 60000);
  if (totalMinutes < 60) return totalMinutes + " min";
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  return hours + "h" + (minutes ? " " + minutes + "min" : "");
}
function readingDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return year + "-" + month + "-" + day;
}
function readingHistory() {
  try {
    const value = JSON.parse(storage.getItem("reader:reading-days") || "{}");
    return value && typeof value === "object" ? value : {};
  } catch (error) {
    return {};
  }
}
function recordReadingInterval(start, end) {
  if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return;
  const history = readingHistory();
  let cursor = start;
  while (cursor < end) {
    const currentDate = new Date(cursor);
    const midnight = new Date(currentDate);
    midnight.setHours(24, 0, 0, 0);
    const segmentEnd = Math.min(end, midnight.getTime());
    const key = readingDateKey(currentDate);
    history[key] = (Number(history[key]) || 0) + (segmentEnd - cursor);
    cursor = segmentEnd;
  }
  storage.setItem("reader:reading-days", JSON.stringify(history));
  const total = Number(storage.getItem("reader:reading-total-ms")) || 0;
  storage.setItem("reader:reading-total-ms", String(total + (end - start)));
}
function recentReadingDays(count) {
  const history = readingHistory();
  const days = [];
  const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
  for (let offset = count - 1; offset >= 0; offset--) {
    const date = new Date();
    date.setHours(12, 0, 0, 0);
    date.setDate(date.getDate() - offset);
    const milliseconds = Number(history[readingDateKey(date)]) || 0;
    days.push({ key: readingDateKey(date), label: weekdays[date.getDay()], milliseconds });
  }
  return days;
}
function readingStreak() {
  const history = readingHistory();
  const date = new Date();
  date.setHours(12, 0, 0, 0);
  if (!(Number(history[readingDateKey(date)]) > 0)) date.setDate(date.getDate() - 1);
  let streak = 0;
  while (Number(history[readingDateKey(date)]) > 0) {
    streak += 1;
    date.setDate(date.getDate() - 1);
  }
  return streak;
}
function bookProgress(book) {
  try {
    const saved = JSON.parse(storage.getItem("reader:progress:" + book.id) || "null");
    if (!saved) return 0;
    if (Number.isFinite(saved.percent)) return Math.max(0, Math.min(100, Math.round(saved.percent)));
    const total = Math.max(1, parseChapters(book.content).length);
    const current = Math.max(0, Math.min(total - 1, Number(saved.current) || 0));
    return Math.round((current / total) * 100);
  } catch (error) {
    return 0;
  }
}

function fitSingleLineTitle(element, minSize) {
  if (!element || !element.clientWidth) return;
  element.style.fontSize = "";
  const maxSize = parseFloat(getComputedStyle(element).fontSize) || minSize;
  if (element.scrollWidth <= element.clientWidth) return;
  const proportionalSize = maxSize * (element.clientWidth / element.scrollWidth);
  element.style.fontSize = Math.max(minSize, Math.min(maxSize, proportionalSize)) + "px";
}

function fitVisibleBookTitles() {
  document.querySelectorAll(".book-page-detail h2").forEach(title => fitSingleLineTitle(title, 18));

}

async function renderReadingStatsView() {
  const host = $("readingStatsContent");
  const books = (await getAllBooks()).filter(book => book.kind === "book");
  const total = Number(storage.getItem("reader:reading-total-ms")) || 0;
  const days = recentReadingDays(7);
  const today = days[days.length - 1].milliseconds;
  const weekTotal = days.reduce((sum, day) => sum + day.milliseconds, 0);
  const maxDay = Math.max(60000, ...days.map(day => day.milliseconds));
  const todayGoal = 30 * 60000;
  const goalAngle = Math.min(360, (today / todayGoal) * 360);

  host.innerHTML = '<section class="stats-hero">'
    + '<span class="stats-eyebrow">YOUR READING</span><h1>阅读数据</h1>'
    + '<div class="stats-hero-ring"><div><strong></strong><span>累计阅读</span></div></div>'
    + '<div class="stats-summary-grid">'
    + '<div><strong data-stat="today"></strong><span>今日</span></div>'
    + '<div><strong data-stat="week"></strong><span>本周</span></div>'
    + '<div><strong data-stat="streak"></strong><span>连续</span></div>'
    + '</div></section>'
    + '<section class="stats-panel"><div class="stats-panel-head"><h2>最近 7 天</h2><span>每天 30 分钟目标</span></div><div class="stats-detail-week"></div></section>'
    + '<section class="stats-panel"><div class="stats-panel-head"><h2>书籍阅读时间</h2><span></span></div><div class="stats-book-list"></div></section>';

  const ring = host.querySelector(".stats-hero-ring");
  ring.style.setProperty("--reading-angle", goalAngle + "deg");
  ring.querySelector("strong").textContent = formatReadingTime(total);
  host.querySelector('[data-stat="today"]').textContent = formatReadingTime(today);
  host.querySelector('[data-stat="week"]').textContent = formatReadingTime(weekTotal);
  host.querySelector('[data-stat="streak"]').textContent = readingStreak() + " 天";

  const chart = host.querySelector(".stats-detail-week");
  days.forEach(day => {
    const item = document.createElement("div");
    item.className = "stats-detail-day";
    item.setAttribute("aria-label", "星期" + day.label + "阅读 " + formatReadingTime(day.milliseconds));
    const value = document.createElement("strong");
    value.textContent = day.milliseconds < 60000 ? "" : Math.floor(day.milliseconds / 60000) + "m";
    const bar = document.createElement("i");
    bar.style.setProperty("--day-height", Math.max(5, (day.milliseconds / maxDay) * 100) + "%");
    const label = document.createElement("span");
    label.textContent = day.label;
    item.append(value, bar, label);
    chart.appendChild(item);
  });

  const list = host.querySelector(".stats-book-list");
  if (!books.length) {
    const empty = document.createElement("p");
    empty.className = "stats-list-empty";
    empty.textContent = "还没有导入书籍";
    list.appendChild(empty);
  } else {
    books.sort((a, b) => liveReadingTime(b.id) - liveReadingTime(a.id));
    books.forEach(book => {
      const row = document.createElement("div");
      row.className = "stats-book-row";
      const title = document.createElement("span");
      title.textContent = book.title;
      const time = document.createElement("strong");
      time.textContent = formatReadingTime(liveReadingTime(book.id));
      row.append(title, time);
      list.appendChild(row);
    });
  }
}

function attachBookSwipeToDelete(art, page, bookId) {
  let tracking = false;
  let startX = 0;
  let startY = 0;
  let pointerId = null;
  const reset = () => {
    tracking = false;
    pointerId = null;
    art.classList.remove("swipe-delete-ready");
    art.style.removeProperty("transform");
  };
  art.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    tracking = true;
    pointerId = event.pointerId;
    startX = event.clientX;
    startY = event.clientY;
  });
  art.addEventListener("pointermove", event => {
    if (!tracking || event.pointerId !== pointerId) return;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    if (dy < -10 && Math.abs(dy) > Math.abs(dx) * 1.15) {
      page._suppressOpen = true;
      art.style.transform = "translateY(" + Math.max(-34, dy * .28) + "px)";
      art.classList.toggle("swipe-delete-ready", dy < -58);
    }
  });
  art.addEventListener("pointerup", async event => {
    if (!tracking || event.pointerId !== pointerId) return;
    const dx = event.clientX - startX;
    const dy = event.clientY - startY;
    const shouldDelete = dy < -58 && Math.abs(dy) > Math.abs(dx) * 1.15;
    reset();
    if (!shouldDelete) {
      setTimeout(() => { page._suppressOpen = false; }, 250);
      return;
    }
    event.preventDefault();
    event.stopPropagation();
    page._suppressOpen = true;
    await removeBook(bookId, event);
    setTimeout(() => { page._suppressOpen = false; }, 500);
  });
  art.addEventListener("pointercancel", () => {
    reset();
    page._suppressOpen = false;
  });
}

// 卡片书脊使用克制的书封色。
const COVER_COLORS = [
  "#446c84", "#657c70", "#967156", "#6c718e",
  "#9b786f", "#6d8792", "#777b62", "#9a825e",
];
function pickCoverColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return COVER_COLORS[h % COVER_COLORS.length];
}
// ============ 弹窗 / 提示（替代 iOS 上可能失效的原生 confirm/alert/prompt） ============
function showConfirm(msg, okText) {
  return new Promise((resolve) => {
    const mask = document.createElement("div");
    mask.className = "modal-mask";
    mask.innerHTML = '<div class="modal-box"><div class="modal-msg"></div><div class="modal-actions"></div></div>';
    mask.querySelector(".modal-msg").textContent = msg;
    const cancel = document.createElement("button");
    cancel.textContent = "取消";
    const ok = document.createElement("button");
    ok.textContent = okText || "确定";
    ok.className = "m-ok";
    mask.querySelector(".modal-actions").appendChild(cancel);
    mask.querySelector(".modal-actions").appendChild(ok);
    document.body.appendChild(mask);
    const done = (v) => { mask.remove(); resolve(v); };
    cancel.onclick = () => done(false);
    ok.onclick = () => done(true);
    mask.addEventListener("click", (e) => { if (e.target === mask) done(false); });
  });
}

function showPrompt(title, initial) {
  return new Promise((resolve) => {
    const mask = document.createElement("div");

    mask.innerHTML = '<div class="modal-box"><div class="modal-msg"></div><input class="modal-input" type="text"><div class="modal-actions"></div></div>';

    mask.querySelector(".modal-actions").appendChild(ok);
    document.body.appendChild(mask);
    const done = (v) => { mask.remove(); resolve(v); };

    ok.onclick = () => done(inp.value);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") done(inp.value); });

// ============ IndexedDB ============
const DB_NAME = "novel-reader";
const STORE = "books";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: "id" });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function putBook(book) {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(book);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getAllBooks() {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function deleteBook(id) {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getBookById(id) {
  const d = await openDB();
  return new Promise((resolve, reject) => {
    const tx = d.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

let currentBottomTab = "reader";
let primaryTabMotionTimer = null;

function updatePrimaryTabMotion(tab) {
  const pill = $("mainTabPill");
  if (!pill) return;

  if (tab === "profile") {
    pill.classList.add("profile-selected");
    currentBottomTab = tab;
    return;
  }
  if (tab !== "reader" && tab !== "writer") return;

  pill.classList.remove("profile-selected");
  pill.classList.remove("squeeze-to-reader", "squeeze-to-writer");

  if (currentBottomTab === "profile" || pill.dataset.active === tab) {
    pill.dataset.active = tab;
    currentBottomTab = tab;
    return;
  }

  void pill.offsetWidth;
  pill.dataset.active = tab;
  pill.classList.add(tab === "writer" ? "squeeze-to-writer" : "squeeze-to-reader");
  clearTimeout(primaryTabMotionTimer);
  primaryTabMotionTimer = setTimeout(() => {
    pill.classList.remove("squeeze-to-reader", "squeeze-to-writer");
  }, 590);
  currentBottomTab = tab;
}

function switchTab(tab) {
  if (tab !== "reader") stopReadingSession();
  updatePrimaryTabMotion(tab);
  $("readerTab").hidden = (tab !== "reader");
  $("writerTab").hidden = (tab !== "writer");
  $("profileTab").hidden = (tab !== "profile");
  $("tabReader").classList.toggle("active", tab === "reader");
  $("tabWriter").classList.toggle("active", tab === "writer");
  $("tabProfile").classList.toggle("active", tab === "profile");
  $("footer").style.display = "";
  if (tab === "writer") renderWriteList();

function loadProfileAvatarElement(file) {
  return new Promise((resolve, reject) => {
    const objectUrl = URL.createObjectURL(file);
    const image = new Image();
    const cleanup = () => URL.revokeObjectURL(objectUrl);
    image.onload = () => {
      cleanup();
      resolve(image);
    };
    image.onerror = () => {
      cleanup();
      reject(new Error("invalid image"));
    };
    image.src = objectUrl;
  });
}

async function prepareProfileAvatar(file) {
  if (!file || (file.type && !file.type.startsWith("image/"))) {
    throw new Error("unsupported image");
  }
  let image;
  if ("createImageBitmap" in window) {
    try {
      image = await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch (error) {
      image = await loadProfileAvatarElement(file);
    }
  } else {
    image = await loadProfileAvatarElement(file);
  }
  const imageWidth = image.naturalWidth || image.width;
  const imageHeight = image.naturalHeight || image.height;
  if (!imageWidth || !imageHeight) {
    throw new Error("empty image");
  }
  const size = 256;
  const side = Math.min(imageWidth, imageHeight);
  const sx = (imageWidth - side) / 2;
  const sy = (imageHeight - side) / 2;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const context = canvas.getContext("2d");
  if (!context) throw new Error("canvas unavailable");
  context.fillStyle = "#ffffff";
  context.fillRect(0, 0, size, size);
  context.imageSmoothingEnabled = true;
  context.imageSmoothingQuality = "high";
  context.drawImage(image, sx, sy, side, side, 0, 0, size, size);
  if (typeof image.close === "function") image.close();
  return canvas.toDataURL("image/jpeg", .88);
}

let activeShelfBookId = null;
let shelfBookCount = 0;
let shelfScrollTimer = null;
let shelfTouching = false;
let lastShelfDotIndex = null;
let shelfDotAnimationTimer = null;

function currentShelfIndex() {
  const shelf = $("shelf");
  return shelf.clientWidth ? Math.round(shelf.scrollLeft / shelf.clientWidth) : 0;
}

function updateShelfPagination() {
  if (!shelfBookCount || !$("shelf").clientWidth) return;
  const position = currentShelfIndex();
  const index = shelfBookCount === 1 ? 0 : (position - 1 + shelfBookCount) % shelfBookCount;
  const pages = $("shelf").querySelectorAll(".book-page:not([data-clone])");
  activeShelfBookId = pages[index].dataset.bookId;
  if (lastShelfDotIndex !== null && index !== lastShelfDotIndex && shelfBookCount > 1) {
    const forward = (index - lastShelfDotIndex + shelfBookCount) % shelfBookCount;
    animateShelfDots(forward <= shelfBookCount / 2 ? "next" : "prev");
  }
  lastShelfDotIndex = index;
}

function animateShelfDots(direction) {
  const dots = $("shelfDots");
  clearTimeout(shelfDotAnimationTimer);
  dots.classList.remove("moving-next", "moving-prev");
  void dots.offsetWidth;
  dots.classList.add(direction === "next" ? "moving-next" : "moving-prev");
  shelfDotAnimationTimer = setTimeout(() => dots.classList.remove("moving-next", "moving-prev"), 540);
}

function setShelfPosition(index) {
  const shelf = $("shelf");
  shelf.style.scrollBehavior = "auto";
  shelf.style.scrollSnapType = "none";
  shelf.scrollLeft = index * shelf.clientWidth;
  requestAnimationFrame(() => {
    shelf.style.scrollBehavior = "";
    shelf.style.scrollSnapType = "";
  });
  updateShelfPagination();
}

function restoreShelfPosition() {
  const shelf = $("shelf");
  if (!shelf.clientWidth || !shelfBookCount) return;
  const pages = [...shelf.querySelectorAll(".book-page:not([data-clone])")];
  const index = Math.max(0, pages.findIndex(page => page.dataset.bookId === activeShelfBookId));
  setShelfPosition(shelfBookCount > 1 ? index + 1 : index);
}

function settleShelfLoop() {
  if (shelfTouching || shelfBookCount < 2) return;
  const position = currentShelfIndex();
  if (position === 0) setShelfPosition(shelfBookCount);
  else if (position === shelfBookCount + 1) setShelfPosition(1);
}

function moveShelf(delta) {
  const shelf = $("shelf");
  if (shelfBookCount < 2) return;
  let position = currentShelfIndex();
  if (position === 0 || position === shelfBookCount + 1) {
    setShelfPosition(position === 0 ? shelfBookCount : 1);
    position = currentShelfIndex();
  }
  const next = Math.max(0, Math.min(position + delta, shelfBookCount + 1));
  shelf.scrollTo({ left: next * shelf.clientWidth, behavior: "smooth" });
}

function renderBookPages(books) {
  const shelf = $("shelf");
  shelf.innerHTML = "";
  const items = [{ id: READING_STATS_PAGE_ID, kind: "stats" }, ...books];
  shelfBookCount = items.length;
  lastShelfDotIndex = null;
  $("shelfPagination").hidden = items.length < 2;
  [...$("shelfDots").children].forEach((dot, index) => { dot.disabled = index === 1 || items.length < 2; });
  function createBookPage(book, index, clone = false) {
    if (book.kind === "stats") return createReadingStatsBookPage(clone);
    const page = document.createElement("article");
    page.className = "book-page";
    page.dataset.bookId = book.id;
    page.tabIndex = clone ? -1 : 0;
    page.setAttribute("role", "button");
    page.setAttribute("aria-label", "打开《" + book.title + "》");
    page.onclick = event => {
      if (page._suppressOpen) {
        event.preventDefault();
        event.stopPropagation();
        page._suppressOpen = false;
        return;
      }
      openBookById(book.id);
    };
    page.onkeydown = event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openBookById(book.id);
      }
    };
    if (clone) page.dataset.clone = "true";
    page.style.setProperty("--cover-accent", pickCoverColor(book.title));

    const art = document.createElement("div");
    art.className = "book-page-art";
    art.innerHTML = FEATURED_ART;
    attachBookSwipeToDelete(art, page, book.id);

    const author = document.createElement("div");
    author.className = "book-page-author";
    author.textContent = bookAuthor(book);

    const progressValue = bookProgress(book);
    const progress = document.createElement("div");
    progress.className = "book-page-progress";
    progress.setAttribute("role", "progressbar");
    progress.setAttribute("aria-label", "阅读进度");
    progress.setAttribute("aria-valuemin", "0");
    progress.setAttribute("aria-valuemax", "100");
    progress.setAttribute("aria-valuenow", String(progressValue));
    progress.innerHTML = '<div class="book-progress-track"><span style="width:' + progressValue + '%"></span></div>';

    const detail = document.createElement("div");
    detail.className = "book-page-detail";
    const title = document.createElement("h2");
    title.textContent = book.title;
    const readTime = document.createElement("p");
    readTime.className = "book-page-read-time";
    readTime.innerHTML = 'Read time · <strong>' + formatReadingTime(liveReadingTime(book.id)) + '</strong>';
    detail.append(title, readTime);

    page.append(art, author, progress, detail);
    return page;
  }
  if (items.length > 1) shelf.appendChild(createBookPage(items[items.length - 1], items.length - 1, true));
  items.forEach((book, index) => {
    shelf.appendChild(createBookPage(book, index));
  });
  if (items.length > 1) shelf.appendChild(createBookPage(items[0], 0, true));
  const selected = Math.max(0, items.findIndex(book => book.id === activeShelfBookId));
  activeShelfBookId = items[selected].id;
  restoreShelfPosition();
  scheduleBookTitleFit();
}

$("shelf").addEventListener("scroll", () => {
  updateShelfPagination();
  clearTimeout(shelfScrollTimer);
  shelfScrollTimer = setTimeout(settleShelfLoop, 150);
}, { passive: true });
$("shelf").addEventListener("scrollend", settleShelfLoop);
$("shelf").addEventListener("touchstart", () => { shelfTouching = true; }, { passive: true });
$("shelf").addEventListener("touchend", () => {
  shelfTouching = false;
  clearTimeout(shelfScrollTimer);
  shelfScrollTimer = setTimeout(settleShelfLoop, 180);
}, { passive: true });
$("shelf").addEventListener("touchcancel", () => { shelfTouching = false; settleShelfLoop(); }, { passive: true });
$("shelf").addEventListener("keydown", event => {
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    event.preventDefault();
    moveShelf(event.key === "ArrowLeft" ? -1 : 1);
  }
});
window.addEventListener("resize", () => {
  restoreShelfPosition();
});

function renderCards(host, books, mode) {
  host.innerHTML = "";
  if (books.length === 0) {
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = mode === "write"
      ? EMPTY_WRITE_SVG + "<div>还没有作品，点击「新建」开始写作</div>"
      : EMPTY_SHELF_SVG;
    host.appendChild(e);
    return;
  }
  for (const b of books) {
    const card = document.createElement("div");
    card.className = "book-card";
    card.onclick = () => (mode === "write" ? openWriteBook(b.id) : openBookById(b.id));

    const cover = document.createElement("div");
    cover.className = "cover";
    const cColor = pickCoverColor(b.title);
    cover.style.setProperty("--cover-accent", cColor);
    const ct = document.createElement("div");
    ct.className = "cover-title";
    ct.textContent = b.title;
    cover.appendChild(ct);

    // 操作按钮：改名 / 删除
    const ops = document.createElement("div");
    ops.className = "ops";
    const renameBtn = document.createElement("button");
    renameBtn.className = "op";
    renameBtn.textContent = "改名";
    renameBtn.onclick = (ev) => { ev.stopPropagation(); renamePrompt(b.id); };
    const delBtn = document.createElement("button");
    delBtn.className = "op";
    delBtn.textContent = "删除";
    delBtn.onclick = (ev) => { ev.stopPropagation(); removeBook(b.id, ev); };
    ops.appendChild(renameBtn);
    ops.appendChild(delBtn);
    cover.appendChild(ops);

    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = '<span>' + formatCount(b.wordCount) + '</span><span>' + formatTime(b.updatedAt) + '</span>';

    card.appendChild(cover);
    card.appendChild(info);
    host.appendChild(card);
  }
}

async function removeBook(id, ev) {
  ev.stopPropagation();
  const ok = await showConfirm("确定删除这本书吗？内容将一并删除。", "删除");
  if (!ok) return;
  try {
    await deleteBook(id);
    storage.removeItem("reader:progress:" + id);
    storage.removeItem("reader:reading-time:" + id);
    await refreshLists();
    showToast("已删除");
  } catch (err) {
    showToast("删除失败");
  }
}

async function renamePrompt(id) {
  const b = await getBookById(id);
  if (!b) return;
  const v = await showPrompt("重命名书籍", b.title);
  if (v === null) return;
  const title = (v || "").trim();
  if (!title) { showToast("名称不能为空"); return; }
  b.title = title;
  await putBook(b);
  await refreshLists();
  showToast("已重命名");
}

async function refreshLists() {
  await renderShelf();
  await renderWriteList();
}

async function importBook(title, content, author) {
  const existing = (await getAllBooks()).find(b => b.kind === "book" && b.title === title);
  const book = {
    id: existing ? existing.id : genId(),
    kind: "book", title, author: author || "", content,
    updatedAt: Date.now(),
    wordCount: content.replace(/\s/g, "").length,
  };
  await putBook(book);
  await refreshLists();
  return book.id;
}

async function openBookById(id) {
  const book = await getBookById(id);
  if (book) openBook(book);
}

// ============ 阅读器 ============
let currentBook = null;
let readerState = { chapters: [], current: 0 };
let readingSession = { bookId: null, startedAt: 0 };

function pauseReadingSession() {
  if (!readingSession.bookId || !readingSession.startedAt) return;
  const stoppedAt = Date.now();
  const elapsed = Math.max(0, stoppedAt - readingSession.startedAt);
  const total = storedReadingTime(readingSession.bookId) + elapsed;
  storage.setItem("reader:reading-time:" + readingSession.bookId, String(total));
  recordReadingInterval(readingSession.startedAt, stoppedAt);
  readingSession.startedAt = 0;
}

function startReadingSession(bookId) {
  if (!bookId) return;
  if (readingSession.bookId !== bookId) {
    pauseReadingSession();
    readingSession.bookId = bookId;
  }
  if (!document.hidden && !readingSession.startedAt) readingSession.startedAt = Date.now();
}

function stopReadingSession() {
  pauseReadingSession();
  readingSession.bookId = null;
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseReadingSession();
  else if (currentBook && !$("readerView").hidden) startReadingSession(currentBook.id);
});
window.addEventListener("pagehide", pauseReadingSession);

let fontSize = 17;
let lineHeight = 1.9;
let theme = "gray";

function applyReaderStyle() {
  document.documentElement.style.setProperty("--font-size", fontSize + "px");
  document.documentElement.style.setProperty("--line-height", lineHeight);
  document.body.dataset.theme = theme;
}
function loadSettings() {
  const s = JSON.parse(storage.getItem("reader:settings") || "{}");
  fontSize = s.fontSize || 17;
  lineHeight = s.lineHeight || 1.9;
  theme = s.theme === "night" ? "night" : "gray";
  if ($("lineHeightSel")) $("lineHeightSel").value = String(lineHeight);
  if ($("themeSel")) $("themeSel").value = theme;
  applyReaderStyle();
}
function saveSettings() {
  storage.setItem("reader:settings", JSON.stringify({ fontSize, lineHeight, theme }));
}
function changeFont(d) { fontSize = Math.min(30, Math.max(12, fontSize + d)); applyReaderStyle(); saveSettings(); }
function setLineHeight(v) { lineHeight = parseFloat(v); applyReaderStyle(); saveSettings(); }
function setTheme(v) { theme = v; applyReaderStyle(); saveSettings(); }

function renderTOC() {
  const toc = $("drawerToc");
  toc.innerHTML = "";
  readerState.chapters.forEach((ch, i) => {
    const b = document.createElement("button");
    b.textContent = ch.title;
    b.onclick = () => { jumpToChapter(i); closeDrawer(); };
    toc.appendChild(b);
  });
}

function highlightTOC() {
  const items = $("drawerToc").querySelectorAll("button");
  items.forEach((el, i) => el.classList.toggle("active", i === readerState.current));
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 懒加载渲染：只渲染已读到的章节，滚动到接近末尾时再补充，避免一次性渲染全文卡顿
let renderedUpTo = 0;
const RENDER_BATCH = 3;

function resetChapters() {
  renderedUpTo = 0;
  $("readerScroll").innerHTML = "";
}

function renderMoreChapters(count) {
  const host = $("readerScroll");
  const end = Math.min(readerState.chapters.length, renderedUpTo + count);
  if (end <= renderedUpTo) return false;
  let html = "";
  for (let i = renderedUpTo; i < end; i++) {
    const ch = readerState.chapters[i];
    html += '<div class="chapter" id="ch-' + i + '"><h2>' + escapeHtml(ch.title) + '</h2>';
    for (const p of ch.paras) html += '<p>' + escapeHtml(p) + '</p>';
    html += '</div>';
  }
  host.insertAdjacentHTML("beforeend", html);
  renderedUpTo = end;
  return renderedUpTo < readerState.chapters.length;
}

// 保证第 i 章已渲染（目录跳转 / 恢复进度时用）
function ensureRendered(i) {
  if (renderedUpTo > i) return;
  renderMoreChapters(i - renderedUpTo + 1);
}

function jumpToChapter(i) {
  readerState.current = i;
  ensureRendered(i);
  const el = document.getElementById("ch-" + i);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  highlightTOC();
  saveProgress();
}

function changeChapter(direction) {
  const next = readerState.current + direction;
  if (next < 0) { showToast("已经是第一章"); return; }
  if (next >= readerState.chapters.length) { showToast("已经是最后一章"); return; }
  jumpToChapter(next);
}

function openBook(book) {
  currentBook = book;
  readerState.chapters = parseChapters(book.content);
  if (readerState.chapters.length === 0) {
    readerState.chapters = [{ title: "正文", paras: book.content.split(/\r?\n/).map(s => s.trim()).filter(Boolean) }];
  }
  $("bookTitle").textContent = book.title;
  renderTOC();
  const saved = JSON.parse(storage.getItem("reader:progress:" + book.id) || "null");
  const start = (saved && saved.current < readerState.chapters.length) ? saved.current : 0;
  readerState.current = start;
  resetChapters();
  renderMoreChapters(3);   // 先渲染开头几章，保证快速进入
  ensureRendered(start);   // 若恢复位置较靠后，渲染到该章
  switchTab("reader");
  showInReaderTab("reader");   // 隐藏底部导览条
  setControls(false);          // 进入沉浸态（控制条隐藏）
  requestAnimationFrame(() => {
    fitSingleLineTitle($("bookTitle"), 10);
    highlightTOC();
    const el = document.getElementById("ch-" + start);
    if (el) {
      const off = (saved && typeof saved.chapterOffset === "number") ? saved.chapterOffset : 0;
      $("readerScroll").scrollTop = el.offsetTop + off;
    }
  });
}

function exitReader() {
  if (progressTimer) { clearTimeout(progressTimer); progressTimer = null; }
  saveProgress();
  stopReadingSession();
  showInReaderTab("shelf");
  renderShelf();
}

// ============ 控制层（点击正文弹出/收起） ============
let controlsOpen = false;
function setControls(show) {
  controlsOpen = show;
  $("readerTop").classList.toggle("show", show);
  $("readerBottom").classList.toggle("show", show);
}
function toggleControls() { setControls(!controlsOpen); }

// ============ 目录抽屉 ============
let drawerOpen = false;
function openDrawer() { $("drawerMask").classList.add("open"); $("drawer").classList.add("open"); drawerOpen = true; }
function closeDrawer() { $("drawerMask").classList.remove("open"); $("drawer").classList.remove("open"); drawerOpen = false; }

// 点击正文：开关控制层；选中文字时不响应
$("readerScroll").addEventListener("click", (e) => {
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return;
  if (drawerOpen) { closeDrawer(); return; }
  toggleControls();
});

let progressTimer = null;
$("readerScroll").addEventListener("scroll", () => {
  const host = $("readerScroll");
  const els = host.querySelectorAll(".chapter");
  let cur = 0;
  els.forEach((el, i) => { if (el.offsetTop <= host.scrollTop + 80) cur = i; });
  if (cur !== readerState.current) { readerState.current = cur; highlightTOC(); }
  // 接近已渲染内容末尾时，追加渲染下一批章节
  if (host.scrollTop + host.clientHeight > host.scrollHeight - 2000) {
    renderMoreChapters(RENDER_BATCH);
  }
  if (progressTimer) clearTimeout(progressTimer);
  progressTimer = setTimeout(saveProgress, 300);
});

function saveProgress() {
  if (!currentBook) return;
  const host = $("readerScroll");
  // 记录「当前章节内」的滚动偏移，精确到段落位置，而不只是章节序号
  let chapterOffset = 0;
  const el = document.getElementById("ch-" + readerState.current);
  if (el) chapterOffset = Math.max(0, host.scrollTop - el.offsetTop);
  const chapterLengths = readerState.chapters.map(chapter =>
    chapter.paras.reduce((sum, paragraph) => sum + paragraph.replace(/\s/g, "").length, 0)
  );
  const totalLength = chapterLengths.reduce((sum, length) => sum + length, 0);
  let completedLength = chapterLengths.slice(0, readerState.current).reduce((sum, length) => sum + length, 0);
  if (el) {
    const readingY = host.getBoundingClientRect().top + Math.min(120, host.clientHeight * .2);
    const paragraphs = [...el.querySelectorAll("p")];
    const sourceParagraphs = readerState.chapters[readerState.current].paras;
    paragraphs.forEach((paragraph, index) => {
      const length = (sourceParagraphs[index] || "").replace(/\s/g, "").length;
      const rect = paragraph.getBoundingClientRect();
      if (rect.bottom <= readingY) completedLength += length;
      else if (rect.top < readingY && rect.height > 0) {
        completedLength += length * Math.min(1, Math.max(0, (readingY - rect.top) / rect.height));
      }
    });
  }
  let percent = totalLength ? (completedLength / totalLength) * 100 : 0;
  if (host.scrollTop + host.clientHeight >= host.scrollHeight - 2 && renderedUpTo >= readerState.chapters.length) {
    percent = 100;
  }
  storage.setItem("reader:progress:" + currentBook.id, JSON.stringify({
    current: readerState.current,
    scrollTop: host.scrollTop,
    chapterOffset: chapterOffset,
    percent: Math.min(100, Math.max(0, percent)),
  }));
}

// ============ 导入入口（底部 + 按钮） ============
function openReaderFile() { $("readerFileInput").click(); }
$("readerFileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = decodeBest(await readFileAsArrayBuffer(file));
    if (!text) { showToast("无法读取文件内容"); return; }
    const suggestedTitle = file.name.replace(/\.txt$/i, "").trim() || "未命名";
    const titleParts = suggestedTitle.split(/\s*[-—_]\s*/).filter(Boolean);
    const suggestedAuthor = titleParts.length > 1 ? titleParts[titleParts.length - 1] : "";
    const info = await showBookInfoDialog(suggestedTitle, suggestedAuthor);
    if (!info) { e.target.value = ""; return; }
    const id = await importBook(info.title, text, info.author);
    await openBookById(id);
  } catch (err) {
    showToast("导入失败");
  }
  e.target.value = "";
});

// ============ 写作 ============
let writerFile = { name: "未命名.txt", dirty: false };
let editingId = null;

function showInWriterTab(view) {
  $("writeListView").hidden = (view !== "list");
  $("editorView").hidden = (view !== "editor");
  $("footer").style.display = (view === "editor") ? "none" : "";
  if (view === "list") renderWriteList();
  setEditorControls(false);
}

// 编辑器控制条（沉浸式：点击正文弹出/收起）
let editorControlsOpen = false;
let editorControlsTimer = null;
function setEditorControls(show) {
  editorControlsOpen = show;
  const bar = $("editorTop");
  if (bar) bar.classList.toggle("show", show);
  // 工具栏浮出时隐藏圆点开关，收起后重新显示
  const fab = document.querySelector(".editor-fab");
  if (fab) {
    fab.style.opacity = show ? "0" : "1";
    fab.style.pointerEvents = show ? "none" : "auto";
  }
  // 自动收起：显示后 4 秒无操作自动隐藏
  if (editorControlsTimer) clearTimeout(editorControlsTimer);
  if (show) {
    editorControlsTimer = setTimeout(() => setEditorControls(false), 4000);
  }
}
function resetEditorTimer() {
  if (editorControlsOpen) {
    if (editorControlsTimer) clearTimeout(editorControlsTimer);
    editorControlsTimer = setTimeout(() => setEditorControls(false), 4000);
  }
}
function toggleEditorControls() { setEditorControls(!editorControlsOpen); }

async function writerNew(silent) {
  if (!silent && writerFile.dirty && $("editor").value) {
    const ok = await showConfirm("当前草稿未保存，确定清空吗？", "清空");
    if (!ok) return;
  }
  editingId = null;
  $("editor").value = "";
  writerFile = { name: "未命名.txt", dirty: false };
  updateWriterUI();
  saveDraft();
  showInWriterTab("editor");
}

async function openWriteBook(id) {
  const b = await getBookById(id);
  if (!b) return;
  editingId = b.id;
  $("editor").value = b.content;
  writerFile = { name: (b.title || "未命名") + ".txt", dirty: false };
  updateWriterUI();
  saveDraft();
  showInWriterTab("editor");
}

function openWriterFile() { $("writerFileInput").click(); }
$("writerFileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $("editor").value = decodeBest(await readFileAsArrayBuffer(file));
  editingId = null;
  writerFile = { name: file.name, dirty: false };
  updateWriterUI();
  saveDraft();
  e.target.value = "";
});

async function writerSave() {
  const content = $("editor").value;
  if (!content.trim()) { showToast("内容为空，无法保存"); return; }
  const title = titleForWriter(writerFile.name, content);
  editingId = await saveWriteBook(title, content, editingId);
  writerFile.dirty = false;
  updateWriterUI();
  await refreshLists();
  showToast("已保存");
}

function writerExport() {
  const content = $("editor").value;
  if (!content.trim()) { showToast("内容为空，无法导出"); return; }
  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = writerFile.name || "未命名.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("已导出");
}

function titleForWriter(name, content) {
  let title = name.replace(/\.txt$/i, "").trim();
  if (!title || title === "未命名") {
    const firstLine = content.split(/\r?\n/).map(s => s.trim()).find(Boolean);
    title = firstLine ? firstLine.slice(0, 30) : "未命名";
  }
  return title;
}

async function saveWriteBook(title, content, idHint) {
  const books = await getAllBooks();
  if (idHint) {
    const existing = books.find(b => b.id === idHint);
    const book = {
      id: idHint,
      kind: existing ? existing.kind : "write",
      title, content,
      updatedAt: Date.now(),
      wordCount: content.replace(/\s/g, "").length,
    };
    await putBook(book);
    return idHint;
  }
  const existing = books.find(b => b.kind === "write" && b.title === title);
  const book = {
    id: existing ? existing.id : genId(),
    kind: "write", title, content,
    updatedAt: Date.now(),
    wordCount: content.replace(/\s/g, "").length,
  };
  await putBook(book);
  return book.id;
}

function onEditorInput() {
  writerFile.dirty = true;
  $("wordcount").textContent = formatCount($("editor").value.replace(/\s/g, "").length);
  saveDraft();
}

let draftTimer = null;
function saveDraft() {
  if (draftTimer) clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    storage.setItem("writer:draft", JSON.stringify({
      name: writerFile.name,
      editingId,
      content: $("editor").value,
    }));
  }, 200);
}

function updateWriterUI() {
  $("writerTitle").textContent = writerFile.name;
  $("wordcount").textContent = formatCount($("editor").value.replace(/\s/g, "").length);
}

// 编辑器交互时重置自动收起计时
$("editor").addEventListener("input", resetEditorTimer);
$("editor").addEventListener("click", resetEditorTimer);
$("editor").addEventListener("touchstart", resetEditorTimer);
$("editorTop").addEventListener("click", (e) => {
  // 按钮点击后延迟一帧重置，避免按钮 action 关闭后再打开
  requestAnimationFrame(resetEditorTimer);
});

// ============ 写作目录 ============
let writerDrawerOpen = false;

function writerChapterList() {
  const text = $("editor").value;
  const list = [];
  const lines = text.split("\n");
  let offset = 0;
  for (const line of lines) {
    if (TITLE_RE.test(line)) {
      list.push({ title: line.trim() || "正文", offset });
    }
    offset += line.length + 1;
  }
  return list;
}

function renderWriterToc() {
  const toc = $("writerToc");
  toc.innerHTML = "";
  const chapters = writerChapterList();
  if (chapters.length === 0) {
    const hint = document.createElement("div");
    hint.style.cssText = "padding:12px 11px;font-size:13px;color:var(--text-soft);line-height:1.6";
    hint.textContent = "暂无章节。输入「第一章 XXX」「序章」等独立成行的标题，即可自动识别为目录。";
    toc.appendChild(hint);
    return;
  }
  chapters.forEach((ch, i) => {
    const b = document.createElement("button");
    b.textContent = ch.title;
    b.onclick = () => jumpWriterChapter(i);
    toc.appendChild(b);
  });
}

function openWriterDrawer() {
  renderWriterToc();
  $("writerDrawerMask").classList.add("open");
  $("writerDrawer").classList.add("open");
  writerDrawerOpen = true;
  setEditorControls(false);
}

function closeWriterDrawer() {
  $("writerDrawerMask").classList.remove("open");
  $("writerDrawer").classList.remove("open");
  writerDrawerOpen = false;
}

function jumpWriterChapter(i) {
  const chapters = writerChapterList();
  const ch = chapters[i];
  if (!ch) return;
  const ta = $("editor");
  ta.focus();
  ta.setSelectionRange(ch.offset, ch.offset);
  // 用隐藏镜像精确测量目标章节位置（含折行），再滚动 textarea
  const mirror = $("editorMirror");
  const cs = getComputedStyle(ta);
  mirror.style.font = cs.font;
  mirror.style.lineHeight = cs.lineHeight;
  mirror.style.padding = cs.padding;
  mirror.style.width = ta.clientWidth + "px";
  mirror.textContent = ta.value.slice(0, ch.offset);
  const y = mirror.scrollHeight;
  ta.scrollTop = Math.max(0, y - ta.clientHeight * 0.3);
  closeWriterDrawer();
}

// ============ 启动 ============
(async function init() {
  loadSettings();
  await refreshLists();
  await renderProfile();
  switchTab("reader");
  showInReaderTab("shelf");
  const draft = JSON.parse(storage.getItem("writer:draft") || "null");
  if (draft) {
    $("editor").value = draft.content || "";
    editingId = draft.editingId || null;
    writerFile = { name: draft.name || "未命名.txt", dirty: false };
    updateWriterUI();
  }
})();
