  setEditorControls(false);
}

// 编辑器控制条（沉浸式：点击正文弹出/收起）
let editorControlsOpen = false;
let editorControlsTimer = null;
function setEditorControls(show) {
  editorControlsOpen = show;
  const bar = $("editorTop");
  if (bar) bar.classList.toggle("show", show);
  // 工具栏浮出时隐藏圆点开关，收起后重新显示
  const fab = document.querySelector(".editor-fab");
  if (fab) {
    fab.style.opacity = show ? "0" : "1";
    fab.style.pointerEvents = show ? "none" : "auto";
  }
  // 自动收起：显示后 4 秒无操作自动隐藏
  if (editorControlsTimer) clearTimeout(editorControlsTimer);
  if (show) {
    editorControlsTimer = setTimeout(() => setEditorControls(false), 4000);
  }
}
function resetEditorTimer() {
  if (editorControlsOpen) {
    if (editorControlsTimer) clearTimeout(editorControlsTimer);
    editorControlsTimer = setTimeout(() => setEditorControls(false), 4000);
  }
}
function toggleEditorControls() { setEditorControls(!editorControlsOpen); }

async function writerNew(silent) {
  animateAddControl(document.querySelector("#writeListView .home-add-btn"));
  const now = Date.now();
  const page = {
    id: genId(),
    kind: "write",
    title: "未命名",
    content: "",
    createdAt: now,
    updatedAt: now,
    wordCount: 0,
  };
  await putBook(page);
  activeWritePageId = page.id;
  pendingAddedWriteId = page.id;
  await renderWriteList();
  const card = $("writeList").querySelector('.write-page-card:not([data-clone])[data-write-id="' + page.id + '"]');
  if (!card) return;
  const editor = card.querySelector(".write-inline-editor");
  let focused = false;
  const focusAddedPage = () => {
    if (focused) return;
    focused = true;
    editor?.focus({ preventScroll: true });
  };
  card.addEventListener("animationend", focusAddedPage, { once: true });
  setTimeout(focusAddedPage, 680);
}

async function openWriteBook(id) {
  const b = await getBookById(id);
  if (!b) return;
  editingId = b.id;
  $("editor").value = b.content;
  writerFile = { name: (b.title || "未命名") + ".txt", dirty: false };
  updateWriterUI();
  saveDraft();
  showInWriterTab("editor");
}

function openWriterFile() { $("writerFileInput").click(); }
$("writerFileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $("editor").value = decodeBest(await readFileAsArrayBuffer(file));
  editingId = null;
  writerFile = { name: file.name, dirty: false };
  updateWriterUI();
  saveDraft();
  e.target.value = "";
});

async function writerSave() {
  const content = $("editor").value;
  if (!content.trim()) { showToast("内容为空，无法保存"); return; }
  const title = titleForWriter(writerFile.name, content);
  editingId = await saveWriteBook(title, content, editingId);
  writerFile.dirty = false;
  updateWriterUI();
  await refreshLists();
  showToast("已保存");
}

function writerExport() {
  const content = $("editor").value;
  if (!content.trim()) { showToast("内容为空，无法导出"); return; }
  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = writerFile.name || "未命名.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("已导出");
}

function titleForWriter(name, content) {
  let title = name.replace(/\.txt$/i, "").trim();
  if (!title || title === "未命名") {
    const firstLine = content.split(/\r?\n/).map(s => s.trim()).find(Boolean);
    title = firstLine ? firstLine.slice(0, 30) : "未命名";
  }
  return title;
}

async function saveWriteBook(title, content, idHint) {
  const books = await getAllBooks();
  if (idHint) {
    const existing = books.find(b => b.id === idHint);
    const now = Date.now();
    const book = {
      id: idHint,
      kind: existing ? existing.kind : "write",
      title, content,
      createdAt: existing?.createdAt || existing?.updatedAt || now,
      updatedAt: now,
      wordCount: content.replace(/\s/g, "").length,
    };
    await putBook(book);
    return idHint;
  }
  const existing = books.find(b => b.kind === "write" && b.title === title);
  const now = Date.now();
  const book = {
    id: existing ? existing.id : genId(),
    kind: "write", title, content,
    createdAt: existing?.createdAt || existing?.updatedAt || now,
    updatedAt: now,
    wordCount: content.replace(/\s/g, "").length,
  };
  await putBook(book);
  return book.id;
}

function onEditorInput() {
  writerFile.dirty = true;
  $("wordcount").textContent = formatCount($("editor").value.replace(/\s/g, "").length);
  saveDraft();
}

let draftTimer = null;
function saveDraft() {
  if (draftTimer) clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    localStorage.setItem("writer:draft", JSON.stringify({
      name: writerFile.name,
      editingId,
      content: $("editor").value,
    }));
  }, 200);
}

function updateWriterUI() {
  $("writerTitle").textContent = writerFile.name;
  $("wordcount").textContent = formatCount($("editor").value.replace(/\s/g, "").length);
}

// 编辑器交互时重置自动收起计时
$("editor").addEventListener("input", resetEditorTimer);
$("editor").addEventListener("click", resetEditorTimer);
$("editor").addEventListener("touchstart", resetEditorTimer);
$("editorTop").addEventListener("click", (e) => {
  // 按钮点击后延迟一帧重置，避免按钮 action 关闭后再打开
  requestAnimationFrame(resetEditorTimer);
});

// ============ 写作目录 ============
let writerDrawerOpen = false;

function writerChapterList() {
  const text = $("editor").value;
  const list = [];
  const lines = text.split("\n");
  let offset = 0;
  for (const line of lines) {
    if (TITLE_RE.test(line)) {
      list.push({ title: line.trim() || "正文", offset });
    }
    offset += line.length + 1;
  }
  return list;
}

function renderWriterToc() {
  const toc = $("writerToc");
  toc.innerHTML = "";
  const chapters = writerChapterList();
  if (chapters.length === 0) {
    const hint = document.createElement("div");
    hint.style.cssText = "padding:12px 11px;font-size:13px;color:var(--text-soft);line-height:1.6";
    hint.textContent = "暂无章节。输入「第一章 XXX」「序章」等独立成行的标题，即可自动识别为目录。";
    toc.appendChild(hint);
    return;
  }
  chapters.forEach((ch, i) => {
    const b = document.createElement("button");
    b.textContent = ch.title;
    b.onclick = () => jumpWriterChapter(i);
    toc.appendChild(b);
  });
}

function openWriterDrawer() {
  renderWriterToc();
  $("writerDrawerMask").classList.add("open");
  $("writerDrawer").classList.add("open");
  writerDrawerOpen = true;
  setEditorControls(false);
}

function closeWriterDrawer() {
  $("writerDrawerMask").classList.remove("open");
  $("writerDrawer").classList.remove("open");
  writerDrawerOpen = false;
}

function jumpWriterChapter(i) {
  const chapters = writerChapterList();
  const ch = chapters[i];
  if (!ch) return;
  const ta = $("editor");
  ta.focus();
  ta.setSelectionRange(ch.offset, ch.offset);
  // 用隐藏镜像精确测量目标章节位置（含折行），再滚动 textarea
  const mirror = $("editorMirror");
  const cs = getComputedStyle(ta);
  mirror.style.font = cs.font;
  mirror.style.lineHeight = cs.lineHeight;
  mirror.style.padding = cs.padding;
  mirror.style.width = ta.clientWidth + "px";
  mirror.textContent = ta.value.slice(0, ch.offset);
  const y = mirror.scrollHeight;
  ta.scrollTop = Math.max(0, y - ta.clientHeight * 0.3);
  closeWriterDrawer();
}

// ============ 启动 ============
(async function init() {
  loadSettings();
  await refreshLists();
  await renderProfile();
  const draft = JSON.parse(localStorage.getItem("writer:draft") || "null");
  if (draft) {
    $("editor").value = draft.content || "";
    editingId = draft.editingId || null;
    writerFile = { name: draft.name || "未命名.txt", dirty: false };
    updateWriterUI();
  }
})();

// 注册 Service Worker（离线缓存 / PWA）
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!hadController || reloaded) return;
      reloaded = true;
      location.reload();
    });
    navigator.serviceWorker.register("./sw.js").then(reg => reg.update()).catch(() => {});
  });
}
